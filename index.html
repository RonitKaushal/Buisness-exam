<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBD Answer Notebook - Entrepreneurship (5 Marks Answers)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Caveat:wght@700&family=Patrick+Hand&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffdf7; --rule:#cfdcee; --margin:#e57373; --ink:#16213e; --ink2:#0b1026;
  --red:#c62828; --pencil:#5b6070; --hl:#fff3a3;
  --lh:32px; --off:-7px;
  --hand:'Patrick Hand','Segoe Print','Comic Sans MS',cursive;
  /* vercel-ish chrome */
  --v-bg:#000; --v-bg2:#0a0a0a; --v-bg3:#111; --v-line:#1f1f1f; --v-line2:#2e2e2e;
  --v-text:#ededed; --v-muted:#a1a1a1; --v-dim:#707070;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:#000;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ================= Vercel-style top bar ================= */
.topbar{position:sticky;top:0;z-index:60;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(0,0,0,.8);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--v-line);font-family:'Geist',Inter,sans-serif;color:var(--v-text)}
.iconbtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;
  border:1px solid var(--v-line2);background:transparent;color:var(--v-text);cursor:pointer;transition:background .15s,border-color .15s}
.iconbtn:hover{background:#1a1a1a;border-color:#3d3d3d}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.2px}
.logo svg{display:block}
.crumb-sep{color:#3a3a3a;font-size:20px;font-weight:300}
.crumb{color:var(--v-muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.topbar .spacer{flex:1}
.kbtn{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px 0 12px;border-radius:6px;border:1px solid var(--v-line2);
  background:var(--v-bg2);color:var(--v-dim);font-size:13.5px;cursor:pointer;min-width:220px;font-family:inherit}
.kbtn:hover{border-color:#3d3d3d;color:var(--v-muted)}
.kbd{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:var(--v-muted);border:1px solid var(--v-line2);
  border-radius:4px;padding:1px 5px;background:#000}
.vbtn{height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--v-line2);background:transparent;color:var(--v-text);
  font-size:13.5px;font-weight:500;cursor:pointer;font-family:'Geist',Inter,sans-serif;transition:background .15s}
.vbtn:hover{background:#1a1a1a}
.vbtn.primary{background:#ededed;color:#000;border-color:#ededed}
.vbtn.primary:hover{background:#fff}

/* ================= Drawer (closed by default) ================= */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:80;width:340px;max-width:88vw;background:var(--v-bg2);border-right:1px solid var(--v-line);
  transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  font-family:'Geist',Inter,sans-serif;color:var(--v-text);box-shadow:0 0 0 1px rgba(255,255,255,.02),24px 0 60px rgba(0,0,0,.6)}
body.nav-open .drawer{transform:none}
body.nav-open .scrim{opacity:1;pointer-events:auto}
.dhead{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;border-bottom:1px solid var(--v-line)}
.dsec{padding:14px 16px;border-bottom:1px solid var(--v-line)}
.dlabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--v-dim);margin:0 0 8px;font-weight:500}
.vinput{width:100%;height:36px;border-radius:6px;border:1px solid var(--v-line2);background:#000;color:var(--v-text);
  padding:0 10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.vinput:focus{border-color:#555;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
select.vinput{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);
  background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--v-line2);border-radius:6px;overflow:hidden;margin-top:8px}
.seg button{background:transparent;border:0;border-right:1px solid var(--v-line2);color:var(--v-muted);font-size:12.5px;height:30px;cursor:pointer;font-family:inherit}
.seg button:last-child{border-right:0}
.seg button.on{background:#1f1f1f;color:var(--v-text)}
.switch{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--v-text);cursor:pointer;user-select:none}
.switch small{display:block;color:var(--v-dim);font-size:12px}
.sw{width:36px;height:20px;border-radius:20px;background:#2e2e2e;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
body.practice .sw{background:#0a72ef}
body.practice .sw::after{transform:translateX(16px)}
.dnav{flex:1;overflow-y:auto;padding:8px 8px 16px}
.dnav::-webkit-scrollbar{width:8px}.dnav::-webkit-scrollbar-thumb{background:#262626;border-radius:8px}
.dgroup{margin-top:6px}
.dgroup > button{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;border:0;color:var(--v-text);
  font-size:13.5px;font-weight:500;padding:8px 8px;border-radius:6px;cursor:pointer;text-align:left;font-family:inherit}
.dgroup > button:hover{background:#161616}
.dgroup > button .n{color:var(--v-dim);font-family:'Geist Mono',monospace;font-size:11.5px}
.dgroup > button .chev{transition:transform .2s;color:var(--v-dim);margin-left:6px}
.dgroup.open > button .chev{transform:rotate(90deg)}
.dlist{display:none;margin:2px 0 6px 10px;border-left:1px solid var(--v-line2)}
.dgroup.open .dlist{display:block}
.dlink{display:flex;gap:8px;align-items:flex-start;padding:6px 8px 6px 12px;color:var(--v-muted);text-decoration:none;font-size:13px;line-height:18px;border-radius:0 6px 6px 0;margin-left:-1px;border-left:1px solid transparent}
.dlink:hover{color:var(--v-text);background:#141414;border-left-color:#555}
.dlink.active{color:#fff;border-left-color:#fff;background:#151515}
.dlink .id{font-family:'Geist Mono',monospace;font-size:11px;color:var(--v-dim);min-width:26px;padding-top:1px}
.dlink .dot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:none;margin-left:auto}
.dot.hp{background:#ff4d4f}.dot.nf{background:#777}.dot.pt{background:#f5a623}
.dlink.hide{display:none}
.dfoot{border-top:1px solid var(--v-line);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dfoot .vbtn{padding:0 6px;font-size:12.5px}
.dcount{font-size:12px;color:var(--v-dim);margin-top:8px}

/* ================= A4 notebook page ================= */
#book{padding:28px 12px 60px}
.page{
  position:relative;width:210mm;min-height:297mm;margin:0 auto 36px;
  background:var(--paper);border-radius:3px;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.6);
  padding:0 16mm 16mm 26mm; overflow:hidden;
}
/* red margin line */
.page::after{content:"";position:absolute;top:0;bottom:0;left:20mm;width:3px;
  border-left:1.2px solid var(--margin);border-right:1.2px solid var(--margin);opacity:.7}
.phead{height:22mm;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:3mm;
  border-bottom:2px solid var(--rule);color:var(--pencil);font-size:13px;font-weight:500}
.phead .pno{display:flex;gap:16px;align-items:flex-end}
.phead .pno span{border-bottom:1px solid #aaa;min-width:24mm;display:inline-block}
.phead .pno b{color:var(--ink);font-weight:700}
.pbody{
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh));
  background-position:0 var(--off);
  line-height:var(--lh);font-size:19.5px;padding-top:var(--lh);min-height:calc(297mm - 22mm - 16mm);
  font-family:var(--hand);letter-spacing:.15px;
}
.pbody *{margin:0}
.pbody p,.pbody li{line-height:var(--lh)}
.pbody ul,.pbody ol{padding-left:24px}
.pbody li{padding-left:2px}
.pbody h3,.pbody h4{line-height:var(--lh);font-weight:700}

/* question header */
.qline{display:flex;gap:10px;align-items:flex-start;color:var(--ink2);font-size:21px;letter-spacing:.1px;-webkit-text-stroke:.35px var(--ink2)}
.qline .qn{white-space:nowrap;color:var(--red)}
.qline .marks{margin-left:auto;white-space:nowrap;border:1.5px solid var(--red);color:var(--red);border-radius:5px;padding:0 8px;
  line-height:24px;margin-top:3px;font-size:15px;-webkit-text-stroke:0;font-family:var(--hand)}
.tags{display:flex;gap:6px;flex-wrap:wrap;height:var(--lh);align-items:center}
.tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:4px;line-height:18px;letter-spacing:.3px}
.t-hp{background:#ffe1e1;color:#b71c1c}.t-imp{background:#ffeccc;color:#c25100}.t-qb{background:#efe0f7;color:#6a1b9a}
.t-rep{background:#fde0ec;color:#9c1458}.t-saq{background:#d9f2ee;color:#00695c}.t-slide{background:#ececec;color:#424242}
.t-full{background:#e0f3e1;color:#1b5e20}.t-partial{background:#fff4c7;color:#7a5f00}.t-nf{background:#e2e2e2;color:#222}
.ansl{color:var(--red);font-weight:700;font-family:'Caveat',cursive;font-size:26px}

.ans{color:var(--ink)}
.ans h4{color:var(--red);font-size:20.5px;font-weight:400;-webkit-text-stroke:.3px var(--red);margin-top:var(--lh);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.ans > h4:first-child,.ans > .nf + h4,.ans > .warn + h4,.ans > .note + h4{margin-top:0}
.ans b{color:var(--ink2);font-weight:400;-webkit-text-stroke:.45px var(--ink2)}
.ex{border-left:3px solid #2e7d32;padding-left:12px;background:rgba(46,125,50,.04)}
.exh{display:flex;align-items:center;gap:8px}
.exh .tag{text-decoration:none;-webkit-text-stroke:0;font-family:Inter,sans-serif}
.t-mat{background:#e0f3e1;color:#1b5e20}.t-mix{background:#e3f0ff;color:#0b4f9c}.t-ill{background:#eeeeee;color:#444}
.ans mark,.hl{background:linear-gradient(transparent 40%,var(--hl) 40%,var(--hl) 90%,transparent 90%);color:inherit;padding:0 2px}
.ans .note{color:var(--pencil);font-style:italic}
.ans table{border-collapse:collapse;width:100%;background:#fff;font-size:17px;line-height:23px}
.ans th,.ans td{border:1px solid #9aa6c4;padding:5px 8px;vertical-align:top;text-align:left;line-height:23px}
.ans th{background:#eef2fb;color:var(--ink2)}
.nf{border:1.5px dashed var(--red);color:var(--red);font-weight:700;padding:0 12px;background:#fff5f5;border-radius:6px}
.warn{border-left:4px solid #f0a500;background:#fffae6;padding:0 12px;color:#5f4300;border-radius:0 6px 6px 0}
.src{color:var(--pencil);font-size:13px;font-family:Inter,sans-serif;box-shadow:inset 0 1.5px 0 #d0d0d0;line-height:var(--lh);margin-top:var(--lh)!important}
.src b{color:#333}
.end{text-align:center;color:#9a9a9a;letter-spacing:6px}

/* ================= diagrams ================= */
.fig{background:#fff;border:1.3px solid #9aa6c4;border-radius:10px;padding:16px 12px 8px;margin:0;position:relative}
.figcap{text-align:center;color:var(--red);font-size:16px;line-height:22px;margin-top:8px}
.box{border:1.5px solid var(--ink);border-radius:8px;background:#fff;padding:5px 10px;text-align:center;line-height:20px;font-size:16px}
.box b{display:block;font-size:16.5px;color:var(--ink2);font-weight:400;-webkit-text-stroke:.35px var(--ink2)}
.box small{display:block;font-size:14.5px;color:#4a5680;line-height:18px}
.flow{display:flex;align-items:center;justify-content:center;gap:4px}
.flow.v{flex-direction:column}
.flow.v .box{min-width:62%;max-width:92%}
.flow.h{flex-wrap:wrap}
.flow.h .box{max-width:190px}
.arr{color:var(--red);font-size:20px;line-height:20px;font-weight:700}
.tree{display:flex;flex-direction:column;align-items:center}
.troot{border:2px solid var(--red);color:var(--red);border-radius:10px;padding:4px 16px;background:#fff;line-height:24px;font-size:18px;text-align:center;-webkit-text-stroke:.35px var(--red)}
.tkids{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px;position:relative;width:100%}
.tkids::before{content:"";position:absolute;top:-12px;left:6%;right:6%;border-top:1.5px solid var(--ink)}
.tkids::after{content:"";position:absolute;top:-22px;left:50%;height:10px;border-left:1.5px solid var(--ink)}
.tkid{position:relative;flex:1 1 130px;max-width:210px;display:flex}
.tkid::before{content:"";position:absolute;top:-12px;left:50%;height:12px;border-left:1.5px solid var(--ink)}
.tkid .box{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .col{border:1.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.two .col h5{margin:0;background:#eef2fb;border-bottom:1.5px solid var(--ink);text-align:center;font-size:17px;font-weight:400;line-height:28px;color:var(--ink2);-webkit-text-stroke:.35px var(--ink2)}
.two .col ul{margin:6px 0;padding-left:22px;font-size:16px;line-height:22px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;border-left:2px solid var(--ink)}
.tl .ev{position:relative;line-height:22px;font-size:16.5px;margin:0 0 8px}
.tl .ev::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--red)}
.tl .ev b{color:var(--red)}
svg.dg{width:100%;height:auto;display:block}
svg.dg text{font-family:'Patrick Hand','Comic Sans MS',cursive;fill:var(--ink);font-size:14.5px;text-anchor:middle}
svg.dg .ln{stroke:#4a5680;stroke-width:1.4;fill:none}
svg.dg .nd{fill:#fff;stroke:var(--ink);stroke-width:1.5}
svg.dg .ct{fill:#fff4f4;stroke:var(--red);stroke-width:2}
svg.dg .ctt{fill:var(--red);font-size:16px;stroke:var(--red);stroke-width:.35px}

/* ================= cover / index / paper ================= */
.cover .pbody{background-image:none;display:flex;flex-direction:column;align-items:center}
.cover h1{font-family:'Caveat',cursive;font-size:62px;line-height:68px;color:var(--ink2);margin-top:20px;text-align:center}
.cover .sub{font-size:16px;color:var(--red);font-weight:600}
.label{width:88%;margin-top:26px;border:1.5px solid var(--ink);border-radius:10px;padding:12px 20px;background:#fff}
.label div{display:flex;gap:10px;border-bottom:1px dotted #999;line-height:40px;font-size:15px}
.label div span:first-child{min-width:130px;color:var(--pencil)}
.instr{width:88%;margin-top:24px;font-size:14.5px;line-height:28px}
.idx table{width:100%;border-collapse:collapse;font-size:13.5px}
.idx th,.idx td{border:1px solid #9aa6c4;padding:0 8px;line-height:var(--lh);vertical-align:top}
.idx th{background:#eef2fb}
.idx td a{color:var(--ink);text-decoration:none}
.idx td a:hover{text-decoration:underline}
.qp .pbody{background-image:none;font-family:'Special Elite','Courier New',monospace;color:#111;font-size:14.5px;line-height:26px}
.qp h2{text-align:center;font-size:19px;line-height:30px}
.qp .rule{border-top:2px solid #111;margin:8px 0}
.qp ol li{margin:0 0 8px;line-height:24px}
.qp a{color:#555;font-size:12px;text-decoration:none;margin-left:6px}

/* practice mode */
body.practice .ans-body{filter:blur(6px);cursor:pointer;user-select:none}
body.practice .page.reveal .ans-body{filter:none}
.hide{display:none!important}

@media (max-width:820px){
  .page{width:100%;min-height:auto;padding:0 14px 20px 34px}
  .page::after{left:22px}
  .two{grid-template-columns:1fr}
  .kbtn{min-width:0}.kbtn .t{display:none}
  .crumb{display:none}
}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .topbar,.drawer,.scrim{display:none!important}
  #book{padding:0}
  .page{margin:0;box-shadow:none;border-radius:0;break-after:page;width:210mm;min-height:297mm}
  body.practice .ans-body{filter:none}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="iconbtn" id="openNav" aria-label="Open navigation" title="Menu">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="#ededed"/></svg>
    <span>EBD Notebook</span>
  </div>
  <span class="crumb-sep">/</span>
  <span class="crumb" id="crumb">Cover</span>
  <div class="spacer"></div>
  <button class="kbtn" id="openSearch"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="t">Search answers...</span><span class="kbd">&#8984;K</span></button>
  <button class="vbtn primary" onclick="window.print()">Print A4</button>
</header>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Navigation">
  <div class="dhead">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="#ededed"/></svg><span>Contents</span></div>
    <button class="iconbtn" id="closeNav" aria-label="Close"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>
  <div class="dsec">
    <input id="search" class="vinput" type="search" placeholder="Search questions and answers...">
    <div class="seg" id="seg">
      <button data-p="" class="on">All</button>
      <button data-p="hp">High Priority</button>
      <button data-p="nf">Not found</button>
    </div>
    <select id="fPriority" class="vinput" style="margin-top:8px">
      <option value="">Filter: all questions</option>
      <option value="hp">High Priority</option>
      <option value="imp">Teacher IMP</option>
      <option value="qb">Question Bank</option>
      <option value="rep">Repeated</option>
      <option value="saq">Book questions</option>
      <option value="nf">Not found / partial</option>
    </select>
    <select id="fSection" class="vinput" style="margin-top:8px"><option value="">All chapters</option></select>
    <div class="dcount" id="count"></div>
  </div>
  <div class="dsec">
    <label class="switch" id="practice"><span>Practice mode<small>Blur answers; click a page to reveal</small></span><span class="sw"></span></label>
  </div>
  <nav class="dnav" id="dnav"></nav>
  <div class="dfoot">
    <button class="vbtn" onclick="goto('cover')">Cover</button>
    <button class="vbtn" onclick="goto('index')">Index</button>
    <button class="vbtn" onclick="goto('qpaper')">Paper</button>
  </div>
</aside>

<div id="book"></div>

<script>
/* =================== DIAGRAM HELPERS =================== */
let SVGID = 0;
function wrap(t, n){ const w=t.split(' '); const L=[]; let c='';
  w.forEach(x=>{ if((c+' '+x).trim().length>n){ if(c) L.push(c); c=x; } else c=(c+' '+x).trim(); });
  if(c) L.push(c); return L; }
function bx(s){ const [h,sub] = Array.isArray(s)?s:[s,'']; return `<div class="box"><b>${h}</b>${sub?`<small>${sub}</small>`:''}</div>`; }
const cap = c => `<div class="figcap">Fig: ${c}</div>`;
const D = {
  flow(c, steps, dir='v'){
    return `<div class="fig"><div class="flow ${dir}">${steps.map((s,i)=>(i?`<div class="arr">${dir==='v'?'&darr;':'&rarr;'}</div>`:'')+bx(s)).join('')}</div>${cap(c)}</div>`;
  },
  tree(c, root, kids){
    return `<div class="fig"><div class="tree"><div class="troot">${root}</div><div class="tkids">${kids.map(k=>`<div class="tkid">${bx(k)}</div>`).join('')}</div></div>${cap(c)}</div>`;
  },
  two(c, a, b, vs='V/S'){
    const col = ([t,items]) => `<div class="col"><h5>${t}</h5><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
    return `<div class="fig"><div class="two">${col(a)}${col(b)}</div>${cap(c)}</div>`;
  },
  timeline(c, items){
    return `<div class="fig"><div class="tl">${items.map(([y,t])=>`<div class="ev"><b>${y}</b> &ndash; ${t}</div>`).join('')}</div>${cap(c)}</div>`;
  },
  mind(c, center, br){
    const n=br.length, W=680, H=Math.max(320, 120+n*27), cx=W/2, cy=H/2, rx=252, ry=H/2-48;
    const bw = n>9 ? 116 : 128, wn = n>9 ? 15 : 17;
    let lines='', nodes='';
    br.forEach((b,i)=>{
      const a=-Math.PI/2 + i*2*Math.PI/n, x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
      lines += `<path class="ln" d="M${cx} ${cy} Q ${(cx+x)/2+12} ${(cy+y)/2-12} ${x} ${y}"/>`;
      const L=wrap(b,wn), h=L.length*16+12;
      nodes += `<rect class="nd" x="${x-bw/2}" y="${y-h/2}" width="${bw}" height="${h}" rx="8"/>` +
        L.map((l,j)=>`<text x="${x}" y="${y-h/2+19+j*16}">${l}</text>`).join('');
    });
    const CL=wrap(center,13), ch=CL.length*18+20;
    const ctr = `<ellipse class="ct" cx="${cx}" cy="${cy}" rx="82" ry="${Math.max(30,ch/2+6)}"/>` +
      CL.map((l,j)=>`<text class="ctt" x="${cx}" y="${cy-ch/2+24+j*18}">${l}</text>`).join('');
    return `<div class="fig"><svg class="dg" viewBox="0 0 ${W} ${H}">${lines}${ctr}${nodes}</svg>${cap(c)}</div>`;
  },
  cycle(c, center, items){
    const id='ar'+(SVGID++), n=items.length, W=640, H=400, cx=W/2, cy=H/2, R=150;
    let arcs='', nodes='';
    const pt = a => [cx+R*Math.cos(a), cy+R*Math.sin(a)];
    for(let i=0;i<n;i++){
      const a1=-Math.PI/2+i*2*Math.PI/n, a2=-Math.PI/2+(i+1)*2*Math.PI/n, g=0.34;
      const [x1,y1]=pt(a1+g), [x2,y2]=pt(a2-g);
      arcs += `<path class="ln" marker-end="url(#${id})" d="M${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2}"/>`;
      const [x,y]=pt(a1), L=wrap(items[i],17), h=L.length*16+12, w=150;
      nodes += `<rect class="nd" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="9"/>`+
        L.map((l,j)=>`<text x="${x}" y="${y-h/2+19+j*16}">${l}</text>`).join('');
    }
    const CL=wrap(center,14);
    return `<div class="fig"><svg class="dg" viewBox="0 0 ${W} ${H}"><defs><marker id="${id}" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c62828"/></marker></defs>${arcs}
      <circle class="ct" cx="${cx}" cy="${cy}" r="62"/>${CL.map((l,j)=>`<text class="ctt" x="${cx}" y="${cy-(CL.length-1)*9+5+j*18}">${l}</text>`).join('')}${nodes}</svg>${cap(c)}</div>`;
  }
};

{id:"A1",s:"A",tags:["imp"],st:"full",
q:"What is Entrepreneurship? Explain the meaning and concept of entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>The word <mark>"Entrepreneurship"</mark> originally evolved from the French expression <b>"entreprendre"</b>. Etymologically, entrepreneurship denotes <b>"taking from below"</b> or <b>"undertaking"</b>.</p>
<h4>Meaning</h4>
<p><mark>Entrepreneurship is the capacity of a person to assume risk, accountability and challenges with a view to explore opportunities, disrupt market norms and create values.</mark> Some scholars defined it in terms of the <b>attributes</b> of an entrepreneur (traits, competencies, cognitive capabilities), while others defined it in terms of the <b>activities</b> that entrepreneurs undertake.</p>
<h4>Concept - Views of Different Scholars</h4>
<ol>
<li><b>Richard Cantillon (1680-1744):</b> first popularised the idea. Business owners pay a particular price for a product to resell it at an uncertain price, so they take on more risk than others.</li>
<li><b>Adam Smith (1776):</b> the entrepreneur is a "profit-seeking enterpriser" who establishes a business with a commercial goal.</li>
<li><b>J.B. Say (1807):</b> the entrepreneur coordinates and manages the factors of production. Functions are "coordination, organisation and supervision".</li>
<li><b>Schumpeter (1934):</b> "The function of entrepreneurs is to reform or revolutionize the pattern of production by exploiting an invention or an untried technological possibility..." The entrepreneur is an innovator.</li>
<li><b>Cole (1942):</b> an "integrated sequence of actions taken by an individual or group... in a world characterized by a large degree of uncertainty".</li>
<li><b>Gartner:</b> entrepreneurship is the creation of new organisations.</li>
<li><b>Shane &amp; Venkataraman (2000):</b> "the process by which opportunities to develop or create new goods &amp; services are discovered, evaluated and exploited". <b>Creativity</b> is its foundation.</li>
<li><b>Stevenson &amp; Mossi (1990):</b> the pursuit of opportunity beyond the resources under current control.</li>
</ol>
${D.mind("Concept of entrepreneurship - views of scholars","ENTREPRENEURSHIP",["Cantillon: risk of uncertain resale","Adam Smith: profit-seeking enterpriser","J.B. Say: coordinator of factors","Schumpeter: innovator","Cole: actions under uncertainty","Gartner: creation of new organisations","Shane & Venkataraman: discover, evaluate, exploit","Stevenson: opportunity beyond resources"])}
<h4>Modern Concept</h4>
<p>Entrepreneurship is the act of creating a business while bearing all the risks with the hope of making a profit. The more modern definition is also about <mark>transforming the world by solving big problems</mark>, such as bringing about social change or creating an innovative product that challenges the status quo.</p>
<h4>Conclusion</h4>
<p>Thus entrepreneurship is the capability and willingness to create, organise and manage a business venture, including handling its inherent risks, to make a profit.</p>`,
src:"Unit-1 part 1.pdf p1-3, p17-18; Introduction to Entrepreneurship slides p3; Unit 2 p3; Teacher IMP note (item 1)"},

{id:"A2",s:"A",tags:["qb","imp"],st:"full",
q:"Explain the history of entrepreneurial activity.",
a:()=>`<h4>Introduction</h4>
<p>The idea of entrepreneurship developed gradually over nearly three centuries. It moved from a <b>risk-bearing trader</b> to a <b>creator of new organisations and exploiter of opportunities</b>.</p>
<h4>Historical Development</h4>
<ol>
<li><b>Richard Cantillon (early 18th century):</b> a French economist and banker who first popularised the idea by studying entrepreneurial activities in France. He pointed out that business owners buy at a particular price and resell at an <mark>uncertain price</mark>, and so bear more risk than other people.</li>
<li><b>Classical economists (Industrial Revolution, mid-18th century, Britain):</b> classical theory focused on rivalry, competition, specialisation and free trade, and outlined three factors of production: <b>land, capital and labour</b>. It was criticised for not explaining the dynamic upheaval caused by industrial-age entrepreneurs.</li>
<li><b>Adam Smith (1776):</b> expanded the economic definition. The entrepreneur is a <mark>"profit-seeking enterpriser"</mark> who establishes a business with a commercial goal.</li>
<li><b>Jean-Baptiste Say (1807):</b> brought <b>economic development</b> into the idea. The entrepreneur coordinates and manages the factors of production, assumes risk, makes profit and builds wealth. Skills of superintendence and administration are needed.</li>
<li><b>Joseph Schumpeter (1934):</b> before him, entrepreneurship was not seen as a dynamic force able to transform a nation's economy. He described the entrepreneur as an <mark>innovator</mark> who disrupts the equilibrium-state market through novel combinations.</li>
<li><b>Cole (1942):</b> entrepreneurship is an integrated sequence of actions under uncertainty.</li>
<li><b>Gartner (1985-2001), Katz &amp; Gartner (1988), Low &amp; MacMillan (1988):</b> entrepreneurship is the creation of new organisations, and the behavioural dispositions of founders are crucial.</li>
<li><b>Shane &amp; Venkataraman (2000), Davidsson et al. (2006):</b> discovering, evaluating and exploiting opportunities, and "the creation of new economic activity".</li>
</ol>
${D.timeline("Timeline - history of entrepreneurship",[["Early 1700s","Cantillon: risk-bearer, buys at a certain price and sells at an uncertain price"],["Mid-1700s","Classical economists: land, capital, labour"],["1776","Adam Smith: profit-seeking enterpriser"],["1807","J.B. Say: coordinator of factors of production"],["1934","Schumpeter: innovator, engine of growth"],["1942","Cole: actions under uncertainty"],["1985-1988","Gartner, Katz & Gartner, Low & MacMillan: creation of new organisations"],["2000-2006","Shane & Venkataraman, Davidsson: opportunity and new economic activity"]])}
<h4>Conclusion</h4>
<p>The concept moved from <b>risk-bearer</b> (Cantillon) to <b>profit-seeker</b> (Smith), <b>coordinator</b> (Say), <b>innovator</b> (Schumpeter), and finally to <b>creator of organisations and exploiter of opportunities</b> (modern scholars).</p>`,
src:"Unit-1 part 1.pdf p1-3 (1.1), p7-8 (classical theory); Teacher IMP note (item 8); Question Bank"},

{id:"A3",s:"A",tags:["qb","imp","saq"],st:"full",
q:"Explain the evolution of the concept of entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>The present academic discipline of entrepreneurship has evolved from various schools of thought. For example, <b>Gartner (1985)</b> gave four perspectives: the individual, the activities, the environment, and the organisation's structure and strategy. <b>Alvarez &amp; Urbano (2011)</b> gave three approaches: economic, psychological and sociological/institutional. The evolution can be classified into the following phases:</p>
<h4>1. Entrepreneur as a Rational Agent</h4>
<p>Following Cantillon's heritage, economists defined the entrepreneur as a <b>rational actor</b>: a risk-seeker (Cantillon, Say, Knight), a superior worker (Say, Smith), an efficient coordinator (Marshall, Casson), an information seeker (Hayek, Kirzner) and an innovator (Schumpeter). Most, except Schumpeter and Kirzner, saw entrepreneurs as <mark>reactive</mark> to changes. The idea lacked clarity and consensus.</p>
<h4>2. From Rational Agent to Personality Traits</h4>
<p>Research focused on individual characteristics using trait theories and psychology. <b>McClelland (1965)</b>: personality is defined by the <mark>need for success or self-realisation</mark>. Other traits: internal locus of control, self-confidence, risk-taking, need for power, drive for independence. The results were inconclusive, and <b>Fonrouge (2002)</b> developed the behavioural school (competencies drive behaviour).</p>
<h4>3. From Personality Traits to Opportunity Recognition</h4>
<p>In the late 1990s the focus turned to how opportunities are found, created and used. <b>Shane &amp; Venkataraman (2000)</b>: discovery and exploitation are two connected processes. <b>Ardichvili et al. (2003)</b>: opportunity development is a continuous process of <mark>perception, discovery and creation</mark>.</p>
<h4>4. From Opportunity to Institutions and Networks</h4>
<p>Environmental, institutional and cultural factors determine how a business is initiated. Sociocultural values encourage risk-taking, innovation and self-reliance. <b>Gnyawali &amp; Fogel (1994)</b> gave five institutional factors. Social networks give access to resources and information.</p>
<h4>5. Constructivist and Integrating Approach</h4>
<p><b>Busenitz et al. (2003)</b> stressed the links among environment, people, organisational capacity and opportunity. <b>Watson (2013)</b> called for integrating history, philosophy and sociology. One must understand the <mark>person, the project and the links between them</mark>.</p>
${D.flow("Phases in the evolution of entrepreneurship",[["Entrepreneur as Rational Agent","Change agent - risk, coordination (Cantillon, Say)"],["Personality Traits","Need for achievement (McClelland)"],["Opportunity Recognition","Discovery & exploitation (Shane & Venkataraman)"],["Institutions & Networks","Socio-cultural environment (Gnyawali & Fogel)"],["Constructivist / Integrating Approach","Person + project + environment (Busenitz, Watson)"]])}
<h4>Conclusion</h4>
<p>The concept evolved from change agent to personality traits, opportunity recognition, networking and institutions, and finally constructivism.</p>`,
src:"Unit-1 part 1.pdf p3-5 (1.2, Activity 1); Introduction slides p9-12; Teacher IMP note (item 9); Question Bank"},

{id:"A4",s:"A",tags:["qb"],st:"partial",
q:"Explain the revolution of entrepreneurship.",
a:()=>`<p class="nf">The term "Revolution of entrepreneurship" is not found in the provided study material.</p>
<p class="note">This is most likely a typo for "Evolution of entrepreneurship" (see Q.A3). The related content that IS in the material is written below.</p>
<h4>Entrepreneur "revolutionizes" production (Schumpeter)</h4>
<p>According to Schumpeter, <mark>"The function of entrepreneurs is to reform or revolutionize the pattern of production</mark> by exploiting an invention or more generally an untried technological possibility for producing a new commodity or producing an old one in a new way, opening a new source of supply of materials or a new outlet for products, by reorganizing a new industry."</p>
<p>Before Schumpeter (1934), entrepreneurship was <b>not seen as a dynamic force</b> capable of transforming and expanding a nation's economic activity. He showed that the entrepreneur <b>destroys or disrupts an equilibrium-state market</b>, where people are otherwise unwilling to change their behaviour because there are not enough incentives.</p>
<h4>How an entrepreneur revolutionizes production</h4>
<p>The Unit 1 text says an entrepreneur essentially revolutionizes the pattern of production of goods or services through:</p>
<ol>
<li>exploiting a <b>novel technological invention</b>,</li>
<li><b>innovating existing means</b> of production,</li>
<li>introducing a <b>novel production process</b>, or</li>
<li>a <b>new business model</b>.</li>
</ol>
<p>The entrepreneur can help a new business thrive by <b>creating new demand, expanding into new markets, and exploring new technology or supply chains</b>.</p>
${D.tree("Ways an entrepreneur revolutionizes the pattern of production","Entrepreneur revolutionizes production",["Novel technological invention","Innovating existing means of production","Novel production process","New business model"])}
<h4>Conclusion</h4>
<p>In the material, entrepreneurship is "revolutionary" because it disrupts the existing market equilibrium and reforms the pattern of production. For the changes in the concept over time, write Q.A3 (Evolution).</p>`,
src:"Unit-1 part 1.pdf p2 (Schumpeter quote), p6 (1.3); Question Bank (additional topic)"},

{id:"B1",s:"B",tags:["qb","saq"],st:"full",
q:"Explain entrepreneurship and intrapreneurship. How is an entrepreneur different from an intrapreneur?",
a:()=>`<h4>Entrepreneur</h4>
<p>An entrepreneur recognises unexplored opportunities, exploits unfulfilled market needs, develops a business idea or plan, and <mark>assumes financial risk and uncertainty</mark> to achieve a commercial goal. They run their own organisation independently to create incremental wealth and impact.</p>
<h4>Intrapreneur / Intrapreneurship</h4>
<p>Individuals who perform as entrepreneurs but do it <mark>within an organisation</mark> are called intrapreneurs. They are employees who innovate for the business and take risks for their employer, i.e. an intra-company entrepreneur.</p>
<p>The term <b>intrapreneurship</b> was coined by <b>Pinchot (1985)</b> to describe the "entrepreneurial spirit" that fosters projects and business initiatives within organisations. Intrapreneurs use their entrepreneurial knowledge, insight and forward thinking in their position. They are imaginative people who often work in teams to create new products, technologies or services for their employers.</p>
<p><b>Examples:</b> Paul Buchheit, who created <b>Gmail</b>, and Ken Kutaragi, who created <b>PlayStation</b> at Sony.</p>
${D.two("Entrepreneur vs intrapreneur",["ENTREPRENEUR",["Runs own organisation independently","Bears all risks: no revenue, small team, uncertain future","Own investment","Rewards can be very attractive (disruptive innovation)","Owns the product"]],["INTRAPRENEUR",["Works within the confines of the company","Company assumes the financial risk","Company makes the investment","Rewards: bonus, promotion, salary hike","Company owns the product as its IP"]])}
<h4>Differences</h4>
<table><tr><th>Basis</th><th>Entrepreneur</th><th>Intrapreneur</th></tr>
<tr><td>Independence</td><td>Independent</td><td>Not independent; works within company objectives</td></tr>
<tr><td>Risk</td><td>Bears the risks of a new business</td><td>Company bears the financial risk</td></tr>
<tr><td>Reward</td><td>Wealth and impact; can be very attractive</td><td>Minimal: bonus, promotion or salary hike</td></tr>
<tr><td>Ownership</td><td>Owns the business</td><td>Company owns the products (intellectual property)</td></tr>
</table>
<h4>Conclusion</h4>
<p>An intrapreneur can develop new concepts, goods and commercial objectives <b>without assuming the risks</b> of forming a new business, but the rewards are smaller than an entrepreneur's.</p>`,
src:"Unit-1 part 1.pdf p6-7 (1.4, Activity 2), p18 (Keywords); Question Bank"},

{id:"B2",s:"B",tags:[],st:"full",
q:"Differentiate between an Entrepreneur and a Manager.",
a:()=>`<h4>Entrepreneur</h4>
<p>An entrepreneur's task is to <mark>recognise unexplored opportunities</mark>, exploit unfulfilled market needs, develop a business idea or plan, and assume financial risk and uncertainty to achieve a commercial goal. The entrepreneur develops solutions through new products and services, and revolutionises the pattern of production. The focus is <b>external</b>: scanning and interpreting external market information to form strategy.</p>
<h4>Manager</h4>
<p>A manager is primarily responsible for <mark>overseeing and guiding the ongoing operations</mark> of an existing firm, to produce and supply goods and services efficiently and on time. A manager is an <b>employee</b> who works for a fixed salary and defined incentives. The main responsibilities are planning, organising, motivating, controlling and coordinating. The sphere of activity is mostly <b>inside</b> the company.</p>
${D.two("Focus of an entrepreneur vs a manager",["ENTREPRENEUR (external focus)",["External market trends","Assumes financial risk and uncertainty","Disruptive innovation and wealth creation","Owner: profit from effort and investment"]],["MANAGER (internal focus)",["Internal day-to-day operations","Salaried employee","Resource optimisation, planning and control","Fixed salary and incentives"]])}
<h4>Differences</h4>
<table><tr><th>Basis</th><th>Entrepreneur</th><th>Manager</th></tr>
<tr><td>Main task</td><td>Recognises opportunities, develops the business idea</td><td>Runs ongoing operations of an existing firm</td></tr>
<tr><td>Risk</td><td>Assumes financial risk</td><td>Does not bear business risk</td></tr>
<tr><td>Status</td><td>Owner</td><td>Employee</td></tr>
<tr><td>Reward</td><td>Profit</td><td>Fixed salary and defined incentives</td></tr>
<tr><td>Focus</td><td>External</td><td>Internal</td></tr>
<tr><td>Aim</td><td>Innovation, value and wealth creation</td><td>Efficient achievement of goals; optimal use of resources</td></tr>
<tr><td>Functions</td><td>Strategy, investment, innovation</td><td>Planning, organising, motivating, controlling, coordinating</td></tr>
</table>
<h4>Conclusion</h4>
<p>The entrepreneur creates the venture and bears its risk, while the manager efficiently runs the existing organisation.</p>`,
src:"Unit-1 part 1.pdf p6 (1.3), p18 (Keywords); Introduction slides p4"},

{id:"C1",s:"C",tags:["saq"],st:"full",
q:"Mention the basic theories of entrepreneurship. Discuss any two theories with relevant examples.",
a:()=>`<h4>Introduction</h4>
<p>Most theories of entrepreneurship have their origin in five academic disciplines: <mark>economics, psychology, anthropology, management and sociology</mark>.</p>
${D.tree("Disciplines of entrepreneurship theories","Theories of Entrepreneurship",[["Economic","economic factors that encourage entrepreneurship"],["Psychological","personality, locus of control, need for achievement"],["Sociological","social environment, institutions, networks"],["Anthropological","culture, customs, beliefs"],["Management",""]])}
<h4>Basic Theories (names)</h4>
<p>Schumpeter's Innovation Theory; Rotter's Locus of Control; McClelland's Need for Achievement; Knight's Risk and Uncertainty; Hagen's Theory; Cochran's Cultural Values; Reynolds' Sociological Theory; Opportunity-Based Theory (Drucker, Stevenson); Kirzner's Entrepreneurial Alertness; Resources and Capabilities; Sarasvathy's Effectuation; Lévi-Strauss's Bricolage.</p>
<h4>1. Innovation Theory - Joseph Schumpeter</h4>
<p>Entrepreneurship stimulates economic development by upending the economy's fixed circular flow through <mark>"novel combinations"</mark> (innovation) of the factors of production. The entrepreneur is a "man of action" and an "engine of growth". Innovation means a new product, a new process, a new market, a new raw-material source or a new organisation structure. Schumpeter separates the <b>inventor</b> (discovers techniques) from the <b>innovator</b> (turns an invention into a viable business).<br><span class="note">Example given in the material: Tesla and iPhone (innovation entrepreneurship).</span></p>
<h4>2. Hagen's Theory</h4>
<p>The creativity of a <mark>marginalised minority group</mark> drives entrepreneurship. Withdrawal of status respect causes personality change and entrepreneurial behaviour. There are four responses: Retreatist, Ritualist, Reformist and Innovator.<br><span class="note">Example: the Japanese samurai community lost its prestige, became vigorous in trying to regain it, and gave rise to many entrepreneurs.</span></p>
<h4>Conclusion</h4>
<p>Each theory explains entrepreneurship from a different angle: economic, psychological, social or cultural.</p>`,
src:"Unit-1 part 1.pdf p7-14 (1.5), p17 (examples), p18 (SAQ 1); Introduction slides p5-6"},

{id:"C2",s:"C",tags:[],st:"full",
q:"Explain Schumpeter's Innovation Theory of entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>Joseph A. Schumpeter (1934) presented the Innovation Theory in his "<b>Theory of Economic Development</b>". According to him, entrepreneurship serves as a <mark>stimulant for economic development</mark> by upending the economy's fixed circular flow.</p>
<h4>Main Points</h4>
<ol>
<li><b>Novel combinations:</b> entrepreneurs experiment with novel combinations of the factors of production, which Schumpeter called <mark>innovation</mark>, and so push the economy to a new level of development.</li>
<li><b>Engine of growth:</b> the entrepreneur is the "man of action", the "engine of growth" and the driver of economic change.</li>
<li><b>Role:</b> the entrepreneur integrates and manages the factors and resources that contribute to productivity.</li>
<li><b>Creative activity:</b> entrepreneurship is "a creative activity" with innovation, risk-taking and resource management as integral parts.</li>
<li><b>Disrupts equilibrium:</b> the entrepreneur destroys or disrupts an equilibrium-state market.</li>
<li><b>Human actor at the centre:</b> Schumpeter was the first leading economist to place human actors at the core of economic development.</li>
</ol>
${D.tree("Forms of innovation (Schumpeter)","INNOVATION = Novel Combinations",["New combination of existing resources","New product or service","New process of production","Entry into a new market","New source of raw material","New industrial / organisational structure"])}
<h4>Inventor vs Innovator</h4>
${D.two("Inventor vs innovator",["INVENTOR",["Discovers new techniques and materials","Interested in the technical work of discovery"]],["INNOVATOR (Entrepreneur)",["Applies or modifies discoveries into unique combinations","Turns an invention into a financially viable business opportunity"]])}
<h4>Conclusion</h4>
<p>According to Schumpeter, the entrepreneur is essentially an <b>innovator</b> who reforms the pattern of production and drives economic development.</p>`,
src:"Unit-1 part 1.pdf p2, p8-9; Introduction slides p5"},

{id:"C3",s:"C",tags:[],st:"full",
q:"Explain David McClelland's Need for Achievement theory.",
a:()=>`<h4>Introduction</h4>
<p>David McClelland developed the need for achievement theory (1961) in his book <b>"The Achieving Society"</b>. It assumes that humans have a need to <mark>succeed, accomplish, excel or achieve</mark> in life. Motivation is the ultimate driver of entrepreneurship.</p>
<h4>Main Points</h4>
<ol>
<li>The desire to succeed motivates successful entrepreneurs. The need for achievement (<b>N-Ach</b>) encourages them to take on risky and uncertain tasks.</li>
<li>People with high N-Ach are <mark>not swayed by money</mark> or any other external reward.</li>
<li>N-Ach is a relatively stable personality attribute that develops in middle childhood through family socialisation and child-rearing that stresses high standards, warmth and self-reliance.</li>
<li>Communities with a strong drive for achievement have <b>greater economic prosperity</b>.</li>
<li>N-Ach can be developed through <b>training</b> (factors file).</li>
</ol>
${D.tree("Three needs according to McClelland","Human Needs",[["Need for Achievement","desire to succeed, progress and grow"],["Need for Power","desire to control or influence others"],["Need for Affiliation","desire for friendly, intimate relationships"]])}
<h4>Five Components of N-Ach</h4>
${D.flow("Components of need for achievement",["Accepting responsibility for problem solving","Setting objectives","Achieving goals by one's own effort","Recognising and using feedback","Taking moderate risk"],'h')}
<h4>Conclusion</h4>
<p>According to McClelland, entrepreneurship emerges in a society with a high need for achievement. One person succeeds and another fails because of differences in motivation.</p>`,
src:"Unit-1 part 1.pdf p9-10; factors.pdf p5 (6.1); Introduction slides p5"},

{id:"C4",s:"C",tags:["saq"],st:"full",
q:"Evaluate the contribution of Joseph Schumpeter and David McClelland with regard to entrepreneurship.",
a:()=>`<h4>Contribution of Joseph Schumpeter</h4>
<ol>
<li>Before Schumpeter (1934), entrepreneurship was <mark>not seen as a dynamic force</mark> able to transform a nation's economy. He made it central to economic development.</li>
<li>He described the entrepreneur as an <b>innovator</b>, "man of action" and "engine of growth" who creates novel combinations: new products, processes, markets, raw materials and organisation.</li>
<li>He showed that the entrepreneur <b>disrupts the equilibrium</b> of the market.</li>
<li>He separated the <b>inventor</b> from the <b>innovator</b>.</li>
<li>He was the first leading economist to place <b>human actors</b> at the core of economic development.</li>
</ol>
<h4>Contribution of David McClelland</h4>
<ol>
<li>He shifted attention to the <mark>psychology</mark> of the entrepreneur. <b>Motivation</b> is the ultimate driver.</li>
<li>The need for achievement (N-Ach), <b>not money</b>, motivates entrepreneurs.</li>
<li>He gave three needs (achievement, power, affiliation) and five components of N-Ach.</li>
<li>He linked high-achievement societies to <b>economic prosperity</b>.</li>
<li>His work started the <b>personality traits phase</b> in the evolution of entrepreneurship (McClelland, 1965).</li>
</ol>
${D.two("Contribution of Schumpeter and McClelland",["SCHUMPETER (Economic view)",["Innovation theory (1934)","Entrepreneur = innovator","Novel combinations","Disrupts equilibrium","Economic development"]],["McCLELLAND (Psychological view)",["Need for achievement (1961)","Entrepreneur = high achiever","Motivation, not money","Three needs: achievement, power, affiliation","Economic prosperity of society"]])}
<h4>Evaluation / Conclusion</h4>
<p>Schumpeter explained <b>what</b> entrepreneurs do (innovate) and its effect on the economy. McClelland explained <b>why</b> people become entrepreneurs (need for achievement). Together they cover the economic and psychological sides of entrepreneurship.</p>`,
src:"Unit-1 part 1.pdf p2, p4, p8-10, p15 (Activity 3)"},

{id:"C5",s:"C",tags:[],st:"full",
q:"Explain the Theory of Locus of Control (Julian Rotter).",
a:()=>`<h4>Introduction</h4>
<p>Locus of control is a crucial component of personality. The idea was first presented by <b>Julian Rotter</b> in the 1950s.</p>
<h4>Meaning</h4>
<p>Locus of control is <mark>an individual's view and perspective about the underlying causes of events in his or her life</mark>. It is a view on whether the outcomes of our actions depend on what we do (internal control orientation) or on external factors beyond our control (external control orientation).</p>
${D.two("Internal vs external locus of control",["INTERNAL LOCUS",["Believes they themselves control the events and outcomes of life","Found in most successful entrepreneurs","Linked with intention to start a business"]],["EXTERNAL LOCUS",["Believes chance, luck or fate cause life's events","Outcomes depend on circumstances beyond control"]])}
<h4>Locus of Control and Entrepreneurship</h4>
<ol>
<li>Empirical findings suggest that an <mark>internal locus of control</mark> is a trait most successful entrepreneurs possess.</li>
<li>Internal locus of control is <b>positively correlated with the intention to start a business</b>.</li>
<li><b>Rauch &amp; Frese (2000)</b> found that company owners have a marginally greater internal locus of control than other groups.</li>
<li>Other studies found high <b>inventiveness, competitive aggressiveness and autonomy</b> among people with internal locus of control.</li>
<li>In the evolution of entrepreneurship, internal locus of control is listed among the traits that influence entrepreneurial behaviour.</li>
</ol>
<h4>Conclusion</h4>
<p>Successful entrepreneurs believe they <b>dictate their own outcomes</b> (internal control).</p>`,
src:"Unit-1 part 1.pdf p4, p9; Introduction slides p5"},

{id:"C6",s:"C",tags:[],st:"full",
q:"Explain Knight's Theory of Risk and Uncertainty.",
a:()=>`<h4>Introduction</h4>
<p>Risk-taking is an essential prerequisite of entrepreneurship. <b>Professor Knight</b> and <b>John Stuart Mill</b> believed that taking risks is an essential part of being an entrepreneur.</p>
<h4>Main Points</h4>
<ol>
<li><b>Profit from risk:</b> the risk-bearing theory states that the entrepreneur <mark>makes profit by taking risks</mark>.</li>
<li><b>Varied degrees:</b> depending on their abilities and preferences, entrepreneurs take on different degrees of risk.</li>
<li><b>More risk, more profit:</b> if a business venture is riskier, the profit is also likely to be larger.</li>
<li><b>Uncertainty:</b> a condition in which neither <b>"a priori reasoning"</b> nor <b>statistical inference</b> can establish the probabilities of events. Applying a priori reasoning to a unique economic event is irrelevant.</li>
<li><b>Reward:</b> profit is the reward for bearing <mark>non-insurable risks and uncertainties</mark>.</li>
<li><b>Function:</b> the amount of profit earned is a function of the level of uncertainty borne.</li>
</ol>
${D.flow("Knight's risk and uncertainty theory",[["Entrepreneur bears risk","according to ability and preference"],["Non-insurable uncertainty","probabilities cannot be calculated"],["PROFIT = reward for uncertainty","more uncertainty, more profit"]])}
<h4>Conclusion</h4>
<p>According to Knight, profit is the specific reward for bearing non-insurable economic uncertainties.</p>`,
src:"Unit-1 part 1.pdf p10; Introduction slides p5"},

{id:"C7",s:"C",tags:[],st:"full",
q:"Explain Hagen's Theory of Entrepreneurship (Status Withdrawal).",
a:()=>`<h4>Introduction</h4>
<p><b>Hagen (1962)</b> argued that the primary driver of entrepreneurship is the <mark>creativity of a marginalised minority group</mark>. He based this on the Japanese <b>samurai</b> community, which lost its respect and prestige, became more active to restore it, and gave rise to several entrepreneurs.</p>
<h4>Main Points</h4>
<ol>
<li>Creativity drives society's transition from a <b>traditional</b> to a <b>modern industrial economy</b>.</li>
<li>He distinguishes the <b>"creative personality"</b> from the <b>"uncreative personality"</b>. Authoritarian child-rearing produces uncreative personalities.</li>
<li><b>Status withdrawal:</b> when a group feels other groups do not respect its goals and beliefs, the loss of respect becomes a catalyst for personality change.</li>
<li><b>Causes of status withdrawal:</b> displacement of a traditional elite, denial of valued symbols, incompatible status symbols due to shifting economic power, and failure to get the expected status after immigrating.</li>
<li>Elites avoid economic activity, so creative people enter it, become economically powerful, and change the socio-economic system.</li>
</ol>
${D.flow("Hagen's status withdrawal process",[["Withdrawal of status respect","displacement, denial of symbols, migration"],["Personality change - creativity",""],["Economic / entrepreneurial activity",""],["Modern economy - status regained",""]],'h')}
${D.tree("Four responses to status withdrawal","Personality types",[["Retreatist","engages in social activity, retreats from work"],["Ritualist","conforms to rules, cannot improve status"],["Reformist","rebel who wants a new society"],["Innovator","uses creativity toward self-imposed goals"]])}
<h4>Conclusion</h4>
<p>According to Hagen, loss of status respect makes marginalised groups creative and entrepreneurial.</p>`,
src:"Unit-1 part 1.pdf p10-11; factors.pdf p5-6 (6.2); Introduction slides p5"},

{id:"C8",s:"C",tags:[],st:"full",
q:"Explain Thomas Cochran's Theory of Cultural Values.",
a:()=>`<h4>Introduction</h4>
<p>According to <b>Thomas Cochran</b>, entrepreneurship represents a <mark>"model personality"</mark> that comes from role expectations, cultural norms or values, and social sanctions. The entrepreneur embodies the <b>ideal personality of society</b>.</p>
<h4>Main Points</h4>
<ol>
<li>The entrepreneur's performance is shaped by three things: his own <b>attitudes towards work</b>, the <b>requirements of sanctioning organisations</b>, and the <b>operational needs of the job</b>.</li>
<li><b>Upbringing:</b> modern child-rearing instils values such as high achievement, cooperation, teamwork and rationalism.</li>
<li><b>Changing roles:</b> the role structure changes as operational requirements shift with long-term changes in <b>population, technology and institutional drift</b>.</li>
<li><b>Social stratum:</b> in most nations, entrepreneurs have come from a specific socio-economic stratum.</li>
<li><b>Protestant ethic:</b> the Protestant ethic of the West helped create a new generation of industrialists.</li>
<li><b>Communities:</b> castes and communities have been foundations of entrepreneurship: the samurai (Japan), the French family structure, <mark>Parsees, Marwaris and Gujaratis (India)</mark>, Yoruba (Nigeria), Kikuya (Kenya), Christians (Lebanon), and Halai Memons (Pakistan).</li>
</ol>
${D.mind("Cochran's model personality","Entrepreneur = Model Personality",["Role expectations","Cultural norms & values","Social sanctions","Own attitude to work","Requirements of sanctioning groups","Operational needs of the job"])}
<h4>Conclusion</h4>
<p>According to Cochran, cultural values and social role expectations shape the entrepreneurial personality.</p>`,
src:"Unit-1 part 1.pdf p11"},

{id:"C9",s:"C",tags:[],st:"full",
q:"Explain P.D. Reynolds' Sociological Theory of entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p><b>P.D. Reynolds (1991)</b> identified <mark>four social contexts</mark> that contribute to exploiting and developing entrepreneurial opportunities.</p>
${D.tree("Reynolds' four social contexts","Sociological Theory (Reynolds)",[["1. Social Networks","trust and goodwill, not opportunism"],["2. Life Course Stage","traits and circumstances of the person"],["3. Ethnic Identification","social background as a driver"],["4. Population Ecology","environmental factors affect survival"]])}
<h4>1. Social Networks</h4>
<p>The emphasis is on <mark>social ties and links that foster trust</mark> rather than opportunism. An entrepreneur must not take advantage of others to prosper. Success comes from goodwill and kindness toward others.</p>
<h4>2. Life Course Stage</h4>
<p>This involves investigating the <b>traits and circumstances</b> of individuals who choose entrepreneurship. Experiences affect how people behave and think, which inspires them to live fulfilling and meaningful lives.</p>
<h4>3. Ethnic Identification</h4>
<p>Sociological background is one of the key <b>"drivers"</b> that motivates someone to launch a business. An individual's potential for advancement is influenced by social background. <mark>Marginalised people</mark> may overcome all obstacles and strive for success because their difficult circumstances drive them to improve their lives.</p>
<h4>4. Population Ecology</h4>
<p><b>Environmental factors</b> have a big impact on business viability. The political system, law, government rules, consumers, workers and rivals affect the survival of new ventures and the performance of an entrepreneur.</p>
<h4>Conclusion</h4>
<p>Reynolds shows that social ties, life experiences, ethnic background and the environment all shape entrepreneurship.</p>`,
src:"Unit-1 part 1.pdf p11-12"},

{id:"C10",s:"C",tags:[],st:"full",
q:"Explain the Opportunity-Based Theory of entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>The opportunity-based paradigm was proposed by <b>Howard Stevenson</b> and <b>Peter Drucker</b>. Unlike the Schumpeterian or Austrian school, it assumes that the entrepreneur <mark>takes advantage of opportunities that arise from change</mark> (in technology, customer preferences and so on) rather than bringing about change.</p>
<h4>Main Points</h4>
<ol>
<li><b>Drucker:</b> "the entrepreneur always searches for change, responds to it, and exploits it as an opportunity." Entrepreneurs are more concerned with opportunities than with problems.</li>
<li><b>Stevenson (1990):</b> broadened Drucker's view by adding <b>resourcefulness</b>. The essence of entrepreneurial management is pursuing opportunities <mark>"without regard to currently controlled resources"</mark>.</li>
<li><b>Ardichvili et al. (2003):</b> opportunity recognition is <b>not a chance discovery</b> but a continuous, proactive process, from perceiving an idea to a complete business plan.</li>
<li><b>Individual differences:</b> the ability to recognise opportunities differs because of cognitive attributes, social networks, prior knowledge and experience, and differences in knowledge structure and information processing.</li>
</ol>
${D.flow("Three phases of opportunity development (Ardichvili et al.)",[["1. Perception","sense an unfulfilled market need or underemployed resource"],["2. Discovery","recognise a 'fit' between the market need and the resource"],["3. Creation","create a new fit between needs and resources as a business concept"]])}
<h4>Conclusion</h4>
<p>According to this theory, the entrepreneur searches for change and exploits it as an opportunity.</p>`,
src:"Unit-1 part 1.pdf p12-13; Introduction slides p5"},

{id:"C11",s:"C",tags:[],st:"full",
q:"Explain Kirzner's Theory of Entrepreneurial Alertness.",
a:()=>`<h4>Introduction</h4>
<p><b>Israel Kirzner (1973)</b> introduced the entrepreneurial discovery theory. It highlights the entrepreneur's role in <mark>eliminating market price discontinuities and bringing the market closer to equilibrium</mark>.</p>
<h4>Main Points</h4>
<ol>
<li>Entrepreneurs balance demand and supply by <b>recognising and exploiting market imperfections</b>.</li>
<li>Market imperfections come from <b>bounded rationality</b> and <b>asymmetric distribution of information</b>.</li>
<li>Driven by profit, the entrepreneur buys items at lower prices and sells them at higher prices. Entrepreneurs <b>set prices</b> rather than simply accept them.</li>
<li>The opportunity is created by the ignorance or incompetence of incumbent firms.</li>
<li><b>Entrepreneurial alertness:</b> the <mark>"individual's ability to identify changes, shifts, opportunities and possibilities which are overlooked by others"</mark>. Alert people have an <b>"antenna"</b> that lets them see problems or gaps from limited clues.</li>
<li>Kirzner (1999): alertness is a "creative and imaginative action" that affects future market transactions.</li>
</ol>
${D.flow("Cognitive processes of alertness (Tang et al., 2012)",[["Scanning & search of information",""],["Making associations & connections","between the information gathered"],["Evaluation & judgment",""]])}
<h4>Conclusion</h4>
<p>According to Kirzner, the alert entrepreneur spots gaps that others miss and fuels market dynamics.</p>`,
src:"Unit-1 part 1.pdf p13; Introduction slides p6"},

{id:"C12",s:"C",tags:[],st:"full",
q:"Explain the Theory of Resources and Capabilities.",
a:()=>`<h4>Introduction</h4>
<p>This highly influential theory was first presented by <b>Chandler (1962), Tilles (1963) and Ansoff (1965)</b>. It can be thought of as a <mark>process of strategy formulation</mark>.</p>
<h4>Main Points</h4>
<ol>
<li><b>Examining resources:</b> the entrepreneur examines the company's resources to gauge their potential for value creation, as defined in a business strategy, so as to capture the most value in a sustainable way.</li>
<li><b>Types of resources:</b> the production process must take into account <b>financial, physical, human, technological, reputational and organisational</b> resources.</li>
<li><b>Capabilities:</b> the ability of a group to carry out a task or activities. They are the <mark>main source of the company's competitive advantage</mark>.</li>
<li><b>Routines:</b> a key to success is effective use of routines, i.e. regular, stable, consistent and predictable patterns of coordinated, repeated acts (learning by doing).</li>
<li><b>Outcome:</b> the creation of sustainable <mark>economies of experience</mark>, which are crucial for entrepreneurs, especially when they launch firms.</li>
</ol>
${D.flow("Resources and capabilities theory",[["Resources","financial, physical, human, technological, reputational, organisational"],["Capabilities","ability of a group to carry out tasks"],["Routines","regular, repeated, learning-by-doing"],["Economies of experience & competitive advantage",""]])}
<h4>Conclusion</h4>
<p>This theory holds that a firm's resources and capabilities, used through routines, give sustainable competitive advantage.</p>`,
src:"Unit-1 part 1.pdf p13-14"},

{id:"C13",s:"C",tags:[],st:"full",
q:"Explain Sarasvathy's Theory of Effectuation.",
a:()=>`<h4>Introduction</h4>
<p>The notion of effectuation was developed by <b>Sarasvathy (2001)</b> to explain the nature of the entrepreneurial process. She argues that the process of entrepreneurship is primarily <mark>"effectuation" rather than "causation"</mark>.</p>
<h4>Causation vs Effectuation</h4>
<p><b>Causation</b> processes take a specific effect as given and choose the means to achieve it. <b>Effectuation</b> processes take a set of means as given and choose among possible effects using those means.</p>
${D.two("Causation vs effectuation (meal example)",["CAUSATION",["Effect (goal) is given","Choose the means to reach it","Example: plan a menu for a particular meal, gather the ingredients, cook the intended meal"]],["EFFECTUATION",["Means (resources) are given","Choose among possible effects","Example: check what ingredients are at hand, then combine them into a palatable meal"]])}
<h4>Main Points</h4>
<ol>
<li>The process starts with a set of <b>restricted resources</b>. The entrepreneur chooses outcomes within a preset degree of <mark>manageable (affordable) loss</mark>.</li>
<li>The entrepreneur weighs the implications and uses existing means to exploit contingencies.</li>
<li>An entrepreneurial firm makes decisions differently from an established firm.</li>
</ol>
<h4>Four Guiding Principles</h4>
${D.tree("Principles of effectuation","Effectuation",["Affordable loss, not expected returns","Strategic partnerships, not competitive analysis","Use contingencies, not pre-existing knowledge","Control an unpredictable future, not predict it"])}
<h4>Conclusion</h4>
<p>Effectuation means acting on existing resources and affordable losses rather than predicting the future.</p>`,
src:"Unit-1 part 1.pdf p14; Introduction slides p6"},

{id:"C14",s:"C",tags:[],st:"full",
q:"Explain the Theory of Entrepreneurial Bricolage.",
a:()=>`<h4>Introduction</h4>
<p>The behavioural theory of entrepreneurial bricolage was first put forth by the French anthropologist <b>Lévi-Strauss in 1962</b>. It seeks to understand how entrepreneurs act when faced with resource limitations in order to <mark>"manage market uncertainties, survive, and perhaps even flourish despite resource constraints"</mark>.</p>
<h4>Main Points</h4>
<ol>
<li><b>Meaning:</b> bricolage means making things and carrying out plans with <mark>whatever is available</mark>.</li>
<li><b>Where it is found:</b> it is more common in <b>microbusinesses and SMEs</b>, because resource constraints are more severe there.</li>
<li><b>Creativity:</b> entrepreneurs' creativity encourages bricolage by building organisational resilience, improvisation, and use of technical systems and artefacts.</li>
<li><b>Refusing limits:</b> businesses using bricolage <b>refuse to accept the restrictions</b> imposed by a shortage of resources.</li>
<li><b>Resources used:</b> they gather both <b>material and immaterial</b> resources and build creative strategies, tactics and policies.</li>
<li><b>Learning:</b> they achieve the desired output through learning, experimentation or even serendipity.</li>
<li><b>Result:</b> bricolage fosters <mark>catalytic innovations</mark> and scale/growth changes.</li>
</ol>
${D.flow("Entrepreneurial bricolage process",[["Resource constraints","common in microbusinesses and SMEs"],["Refuse the limits; gather available material and immaterial resources",""],["Improvise, learn, experiment","creativity and resilience"],["Survive, flourish, catalytic innovation",""]])}
<h4>Conclusion</h4>
<p>Bricolage means improvising and building solutions with whatever means are immediately available.</p>`,
src:"Unit-1 part 1.pdf p14; Introduction slides p6"},

{id:"D1",s:"D",tags:["imp","saq"],st:"full",
q:"Discuss the various types of entrepreneurs / entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>Different people have different aims and visions for their business. The type depends on their <mark>skill level, prior knowledge, experience, the entrepreneurial ecosystem of the region, and preference</mark>.</p>
${D.mind("Types of entrepreneurship","TYPES OF ENTREPRENEURSHIP",["Small Business","Large Company","Scalable Start-up","International","Social","Environmental (Ecopreneur)","Technopreneur","Imitative","Researcher","Innovation","Cyber"])}
<ol>
<li><b>Small Business:</b> most entrepreneurial activity in India. Funded by own savings, friends and family; family-managed. <i>E.g. milk kiosks, grocery stores, salons.</i></li>
<li><b>Large Company:</b> big business houses with competitive advantage built through R&amp;D. <i>E.g. Apple, Samsung.</i></li>
<li><b>Scalable Start-up:</b> an innovative idea funded by venture capitalists for its originality and scalability; aims at quick growth and large profits.</li>
<li><b>International:</b> operations outside India (overseas sales unit, exports); profitable when local demand falls and world demand rises.</li>
<li><b>Social:</b> solves social problems and prioritises sustainable social change over profit. <i>E.g. non-profit organisations.</i></li>
<li><b>Environmental (Ecopreneurship):</b> eco-friendly alternatives; environmental value over monetary gain. <i>E.g. audiobooks, impact blogs, SaaS.</i></li>
<li><b>Technopreneurship:</b> heavily technology-based; takes measured risks.</li>
<li><b>Imitative:</b> copies existing concepts, often by franchise. <i>E.g. fast food restaurants.</i></li>
<li><b>Researcher:</b> studies the market thoroughly; relies on data and logic, not intuition.</li>
<li><b>Innovation:</b> fills market gaps with cutting-edge technology. <i>E.g. Tesla, iPhone.</i></li>
<li><b>Cyber:</b> online (virtual) business. <i>E.g. online retail, OTT services.</i></li>
</ol>
<h4>Conclusion</h4>
<p>Entrepreneurs range from small family businesses to scalable, innovative and online ventures, depending on skill, experience and ecosystem.</p>`,
src:"Unit-1 part 1.pdf p15-17 (1.6), p18 (SAQ 3 & 5); Introduction slides p7-8; Teacher IMP note (item 2)"},

{id:"D2",s:"D",tags:["slide"],st:"full",
q:"What is Innovation Entrepreneurship? What is Research(er) Entrepreneurship?",
a:()=>`<h4>Innovation Entrepreneurship</h4>
<p>Innovation Entrepreneurship involves the <mark>identification of market gaps and leveraging cutting-edge technology and innovative thinking</mark> to create goods and services that can improve people's lives.</p>
<ol>
<li>Such business ideas are <b>novel and unique</b>; nobody else has thought of them yet.</li>
<li>It suits people who routinely <b>think outside the box</b> and come up with creative, imaginative solutions.</li>
<li>It uses cutting-edge technology to fill market gaps.</li>
<li><b>Examples:</b> Tesla and iPhone.</li>
</ol>
<h4>Researcher Entrepreneurship</h4>
<p>Researcher entrepreneurs <mark>thoroughly investigate the market and available opportunities before launching</mark> the business.</p>
<ol>
<li>They believe that being <b>well-informed, organised and prepared</b> gives a higher chance of success.</li>
<li>They depend less on intuition and gut feeling and more on <b>knowledge, data and logic</b>.</li>
<li>They follow a <b>detailed plan</b> and study research findings before starting.</li>
<li>Their aim is to <b>lower the probability of failure</b>.</li>
</ol>
${D.two("Innovation vs researcher entrepreneurship",["INNOVATION ENTREPRENEUR",["Identifies market gaps","Cutting-edge technology","Novel, unique ideas","Thinks outside the box","E.g. Tesla, iPhone"]],["RESEARCHER ENTREPRENEUR",["Investigates the market first","Knowledge, data, logic","Less intuition and gut feeling","Detailed plan","Lower probability of failure"]])}
<h4>Conclusion</h4>
<p>The innovation entrepreneur succeeds through <b>novelty</b>, while the researcher entrepreneur succeeds through <b>preparation and data</b>.</p>`,
src:"Unit-1 part 1.pdf p17, p18 (Keywords); Introduction slides p13 (slide questions)"},

{id:"D3",s:"D",tags:["qb"],st:"partial",
q:"Explain any five entrepreneurial traits.",
a:()=>`<p class="warn">There is no separate chapter titled "Entrepreneurial Traits" in the provided material. These traits are compiled from the personality-traits phase of evolution, the psychological theories, and the Unit 2 MCQ (risk bearer, innovator, leader).</p>
<h4>Introduction</h4>
<p>In the personality-traits phase, trait theories and psychology were used to identify the <mark>characteristics and psychological attributes</mark> of entrepreneurs that are relevant to business venturing.</p>
${D.mind("Entrepreneurial traits (as named in the material)","ENTREPRENEURIAL TRAITS",["Need for achievement","Internal locus of control","Risk-taking","Innovativeness & creativity","Self-confidence","Drive for independence","Alertness","Tolerance for uncertainty","Leadership"])}
<ol>
<li><b>Need for Achievement:</b> a desire and motivation to succeed, progress and grow (McClelland). Such people take on risky, uncertain tasks and are <mark>not swayed by money</mark>. They accept responsibility, set objectives, achieve goals by their own effort and use feedback.</li>
<li><b>Internal Locus of Control:</b> the belief that one controls one's own outcomes, not luck or fate (Rotter). Most successful entrepreneurs have it, and it is linked with inventiveness and autonomy.</li>
<li><b>Risk-taking (Risk bearer):</b> risk-taking is an essential prerequisite of entrepreneurship. The entrepreneur bears non-insurable risk, and profit is the reward (Knight). N-Ach also includes a propensity for <b>moderate</b> risk.</li>
<li><b>Innovativeness and Creativity (Innovator):</b> the entrepreneur creates novel combinations (Schumpeter). <mark>Creativity is the foundation of entrepreneurship</mark> (Shane &amp; Venkataraman).</li>
<li><b>Self-confidence and Drive for Independence:</b> named among the traits that influence entrepreneurial behaviour, along with the need for power.</li>
<li><b>Alertness:</b> the ability to spot opportunities overlooked by others, an "antenna" (Kirzner).</li>
<li><b>Tolerance for uncertainty and ambiguity</b> and <b>Leadership</b> ("Leader" appears as a characteristic in the Unit 2 MCQ).</li>
</ol>
<h4>Conclusion</h4>
<p class="note">Write any five. Note from the material: it is always difficult to identify specific traits that lead to success, and the findings of trait studies were sometimes inconclusive.</p>`,
src:"Unit-1 part 1.pdf p4, p8, p9-10; Unit 2 p13-14 (Check Your Progress Q1); Question Bank"},

{id:"D4",s:"D",tags:["saq"],st:"partial",
q:"Explain the factors which motivate people to become entrepreneurs.",
a:()=>`<p class="warn">No direct answer section exists in the material. This answer is compiled from the theories and factors it covers.</p>
<h4>Introduction</h4>
<p>People become entrepreneurs because of a mix of <mark>personal (psychological) drives</mark> and a <mark>supportive environment</mark>.</p>
${D.mind("Motivating factors for entrepreneurship","WHY PEOPLE BECOME ENTREPRENEURS",["Need for achievement","Loss of status respect","Profit as reward for risk","Opportunity from change","Internal locus of control","Social / ethnic background","Supportive environment"])}
<ol>
<li><b>Need for high achievement:</b> the desire to succeed is the ultimate driver (McClelland); it can be developed through training.</li>
<li><b>Withdrawal of status respect:</b> groups that lose respect turn to entrepreneurship to regain it (Hagen; the samurai of Japan).</li>
<li><b>Profit as a reward for risk:</b> profit is the reward for bearing uncertainty (Knight).</li>
<li><b>Opportunities from change:</b> the entrepreneur searches for change and exploits it (Drucker, Stevenson).</li>
<li><b>Internal locus of control:</b> it is positively linked with the intention to start a business.</li>
<li><b>Social and ethnic background:</b> marginalised people are driven by difficult circumstances to improve their lives (Reynolds).</li>
<li><b>Supportive environment:</b> availability of capital and market, social legitimacy, security, government support, infrastructure and training.</li>
</ol>
<h4>Conclusion</h4>
<p>Both inner motivation and external conditions motivate people to become entrepreneurs.</p>`,
src:"Unit-1 part 1.pdf p9-12, p18 (SAQ 2); factors.pdf p3-7"},

{id:"E1",s:"E",tags:["qb","imp"],st:"full",
q:"Explain the process of entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>The entrepreneurial process is a series of <mark>five steps</mark> that an entrepreneur follows to start and run a new venture. It is repeated for every new venture.</p>
${D.flow("Entrepreneurial process",[["1. Identification & Evaluation of the Opportunity","idea generation, study of the market"],["2. Development of the Business Plan","mission, vision, goals, capital, products"],["3. Determination of the Required Resources","finance and human resources"],["4. Management of the Resulting Enterprise","operate the business, management structure"],["5. Harvesting","future growth, development or demise"]])}
<h4>1. Identification and Evaluation of the Opportunity</h4>
<p>The process begins with <b>idea generation</b>: the entrepreneur identifies and evaluates business opportunities and studies the market. It is a very difficult task, because the opportunity does not suddenly appear. It is evaluated by asking: <mark>Is it worth investing in? Is it sufficiently attractive? Are the solutions feasible? Is there a competitive advantage? What is the risk?</mark></p>
<h4>2. Development of the Business Plan</h4>
<p>A comprehensive business plan acts as a <b>benchmark and evaluation criterion</b> to check whether the organisation is moving towards its goals. Its components are the mission and vision statement, goals and objectives, capital requirement, and description of products and services.</p>
<h4>3. Determination of the Required Resources</h4>
<p>The entrepreneur identifies and acquires the sources of <b>finance and human resources</b>, finding investors and the personnel to carry out business activities.</p>
<h4>4. Management of the Resulting Enterprise</h4>
<p>Once funds are raised and employees hired, operations begin. First, the entrepreneur decides the <b>management structure or hierarchy</b> needed to solve operational problems.</p>
<h4>5. Harvesting</h4>
<p>The entrepreneur decides on the venture's <b>future growth, development or demise</b>. Actual growth is compared with planned growth, and a decision on stability or expansion is taken.</p>
${D.cycle("Entrepreneurial process - a never-ending cycle","Never-ending process",["Identify & evaluate opportunity","Business plan","Required resources","Manage enterprise","Harvesting"])}
<h4>Conclusion</h4>
<p>The process is followed again and again whenever a new venture is taken up, so it is a <b>never-ending process</b>.</p>`,
src:"Process of entrpreenurship.pdf slides 2-7; Teacher IMP note (item 5); Question Bank"},

{id:"E2",s:"E",tags:["qb"],st:"nf",
q:"Explain any two techniques of idea screening.",
a:()=>`<p class="nf">Answer not found in provided study material.</p>
<p class="note">None of the uploaded files names or explains "idea screening techniques". Only the related points that ARE in the material are given below, as supporting points.</p>
<h4>Related: evaluating an opportunity (Step 1 of the entrepreneurial process)</h4>
<p>An entrepreneurial process begins with idea generation, in which the entrepreneur identifies and evaluates business opportunities and studies the market. Once the opportunity has been decided upon, the next step is to <mark>evaluate it</mark>. The entrepreneur evaluates it by continuously asking questions:</p>
${D.flow("Questions used to evaluate an opportunity (related, from the material)",["Is the opportunity worth investing in?","Is it sufficiently attractive?","Are the proposed solutions feasible?","Is there any competitive advantage?","What is the risk associated with it?"])}
<h4>Related: researcher approach</h4>
<p>Researcher entrepreneurs thoroughly investigate the market and opportunities before launching. They depend on <b>knowledge, data and logic</b> rather than intuition, follow a detailed plan, and study research findings to lower the probability of failure.</p>
<h4>Related: environmental scanning</h4>
<p>Environmental scanning gives an idea of the enterprise's <b>strengths, weaknesses, opportunities and threats</b>, and of target customers, their needs and shopping habits.</p>
<p class="note">Upload notes on idea screening techniques to get a complete answer.</p>`,
src:"Searched all files. Related: Process of entrpreenurship.pdf slide 3; Unit-1 part 1.pdf p17; factors.pdf p6-7"},
