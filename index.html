{id:"F1",s:"F",tags:["imp"],st:"full",
q:"Explain the factors affecting entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>The establishment and growth of entrepreneurship is <mark>not natural</mark>. Along with the entrepreneur's personal qualities, the country's economic conditions, socio-cultural environment and government also affect it. These factors can have <b>positive (facilitating)</b> or <b>negative (inhibiting)</b> impacts.</p>
${D.tree("Factors affecting entrepreneurship","FACTORS",[["Economic","capital, labour, raw material, market"],["Social","legitimacy, mobility, marginality, security"],["Psychological","need for achievement, status respect"],["Government / Political","policies, SEZs, MSMED Act 2006"],["Other","infrastructure, environmental scanning, training"]])}
<h4>1. Economic Factors</h4>
<p><b>Capital</b> is the life blood of business; <b>labour</b> means quality, cheap labour; <b>raw material</b> must be available at economic cost; the <b>market</b> provides the reward.</p>
<h4>2. Social Factors</h4>
<p><b>Legitimacy</b> means the social norms and values; <b>social mobility</b> means openness of society; <b>social marginality</b> means society expects some groups to take entrepreneurial roles; and entrepreneurs need <b>security</b>.</p>
<h4>3. Psychological Factors</h4>
<p><b>Motivation for high achievement</b> (McClelland) and <b>status respect</b> (Hagen).</p>
<h4>4. Government / Political Factors</h4>
<p>Policies, special economic zones, industrial estates, the <b>MSMED Act 2006</b>, a separate MSME ministry and schemes. Without an active government, entrepreneurship does not grow.</p>
<h4>5. Other Factors</h4>
<p><b>Infrastructure</b> (e.g. cold stores), <b>environmental scanning</b> (SWOT, customers) and <b>training</b> (knowledge, skills, N-Ach).</p>
<h4>Conclusion</h4>
<p><mark>All factors are interconnected and mutually dependent.</mark> No single factor can bring complete growth; all must contribute positively.</p>`,
src:"factors.pdf p2-7; Teacher IMP note (item 3)"},

{id:"F2",s:"F",tags:["qb"],st:"full",
q:"Explain the effect of economic factors on entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>Economic factors contribute to the economic development of the country. They create a conducive environment and provide <mark>economic security and a favourable environment</mark> to an enterprise.</p>
${D.tree("Economic factors affecting entrepreneurship","ECONOMIC FACTORS",[["Capital","life blood of business"],["Labour","quality and cheap labour"],["Raw Material","availability at economic cost"],["Market","provides the reward"]])}
<h4>1. Capital</h4>
<p>Capital is the <mark>life blood of any enterprise</mark> and a major prerequisite. It helps arrange land, machinery, material and manpower, and is a "lubricant to drive the engine of entrepreneurship growth". As the supply of capital increases, entrepreneurship increases (USA, China, Russia, France). Lack of capital is a major reason for failure.</p>
<h4>2. Labour</h4>
<p>Adam Smith considered labour an important factor. Quality labour in the right quantity, and cheap labour, boost entrepreneurship. Labour problems can be managed through labour-saving innovation or technology, as Japan and the USA did. The labour issue is <b>easier to manage than the capital issue</b>.</p>
<h4>3. Raw Material</h4>
<p>Quality raw material at economic cost is a major determinant of where an enterprise is set up. <i>Example: a furniture maker who has arranged capital and labour will still fail if no timber is available nearby.</i> It directly affects cost of production, but can be managed through innovative supply chains and technology.</p>
<h4>4. Market</h4>
<p>The market provides the potential reward. Entrepreneurs can arrange capital, labour and materials but <mark>cannot create a market</mark>, only generate demand. Its nature, size and composition influence entrepreneurs. Distance can be managed by transport. Rapid market development increased the number of entrepreneurs in Germany and Japan.</p>
<h4>Conclusion</h4>
<p>Adequate capital, quality labour, a regular supply of raw materials and a developed market together drive entrepreneurship growth.</p>`,
src:"factors.pdf p3-4 (Section 4); Question Bank"},

{id:"F3",s:"F",tags:["qb"],st:"full",
q:"Explain the role of social factors impacting entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>Social scientists say economic factors alone are not enough. <mark>"An entrepreneur can never be successful where society fails."</mark> The effect of economic factors itself depends on social factors.</p>
${D.tree("Social factors affecting entrepreneurship","SOCIAL FACTORS",[["Entrepreneurship Legitimacy","social norms and values"],["Social Mobility","social and geographical"],["Social Marginality","group expects entrepreneurial roles"],["Security","social and economic security"]])}
<h4>1. Entrepreneurship Legitimacy</h4>
<p>The system of social norms and values is called the legitimacy of entrepreneurship. Society's approval or rejection influences behaviour. <b>Schumpeter</b> called it the appropriate social climate. The <b>social status of entrepreneurs</b> is its most important element. Low legitimacy may disturb entrepreneurship but not eliminate it, and where government support is high, growth can still occur.</p>
<h4>2. Social Mobility</h4>
<p>This includes social and geographical mobility. Entrepreneurs grow in a <mark>flexible and liberal society</mark> that adapts to change. Young educated people who move away often start businesses when they return.</p>
<h4>3. Social Marginality</h4>
<p>A social group supports a particular role for an individual because of differences from the main groups (religious, cultural or migration). It is determined by legitimacy and mobility. It is helped by a <b>positive attitude</b> toward a business within the group and a very high degree of <b>unity or solidarity</b>.</p>
<h4>4. Security</h4>
<p>Entrepreneurs emerge in a society that gives them security, because they fear losing their assets. Views differ on how much security is needed (a little, moderate, or even turbulent conditions), but security is regarded as a significant factor.</p>
<h4>Conclusion</h4>
<p class="note">Also relevant: Reynolds' sociological theory (social networks, life course stage, ethnic identification, population ecology).</p>`,
src:"factors.pdf p4-5 (Section 5); Unit-1 part 1.pdf p11-12; Question Bank"},

{id:"F4",s:"F",tags:["qb"],st:"full",
q:"Explain the role of psychological factors impacting entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>Even if the economy and society support entrepreneurship, <mark>if individuals are not self-motivated, all support is wasted</mark>. Psychological theories say a positive attitude and motivation are crucial.</p>
<h4>1. Motivation for High Achievement</h4>
<p>According to <b>McClelland's need-achievement theory</b>, motivation for high achievement is the <mark>major psychological determinant</mark>. Entrepreneurship emerges in a society with a high need for achievement. One person succeeds and another fails because of low motivation. This need can be <b>developed through training</b>.</p>
<h4>2. Status Respect</h4>
<p>Withdrawal of expected status respect forces a group or individual to choose something different to regain respect, most often entrepreneurship. <b>Hagen (1962)</b> gives the example of Japan's high growth after the withdrawal of status respect from the samurai group.</p>
${D.flow("Status respect as a psychological factor (Hagen)",[["Causes of withdrawal","displaced from origin, values disrespected, status inconsistency, migration"],["Withdrawal of status respect",""],["Results","work hard for an identity through business, adopt a new adaptive life, become innovative and creative"]])}
<h4>Other psychological attributes (Unit 1)</h4>
<p>Personality, locus of control, risk-taking capability, need for achievement, creativity, innovativeness, and tolerance for uncertainty and ambiguity.</p>
<h4>Conclusion</h4>
<p>Motivation and status-related drives inside the individual are essential for turning economic and social support into entrepreneurship.</p>`,
src:"factors.pdf p5-6 (Section 6); Unit-1 part 1.pdf p8-10; Question Bank"},

{id:"F5",s:"F",tags:["qb"],st:"partial",
q:"Explain the role of cultural factors impacting entrepreneurship.",
a:()=>`<p class="warn">The factors file has no separate heading for "cultural factors". This answer is compiled from the cultural and socio-cultural content in Unit 1 and the factors file.</p>
<h4>Introduction</h4>
<p><b>Anthropological theories</b> deal with the influence of the <mark>culture of the people in the community, its development, customs and beliefs</mark> on the entrepreneurial process.</p>
${D.mind("Cultural factors affecting entrepreneurship","CULTURAL FACTORS",["Cultural values (Cochran)","Socio-cultural values","Open social & cultural system","Religious / cultural marginality","Child-rearing practices (Hagen)","Communities: Parsees, Marwaris, Gujaratis"])}
<ol>
<li><b>Cochran's cultural values:</b> the entrepreneur is a "model personality" shaped by role expectations, cultural norms and social sanctions. Modern upbringing instils high achievement, cooperation, teamwork and rationalism.</li>
<li><b>Community and religion:</b> the <mark>Protestant ethic</mark> of the West helped create industrialists. Communities such as the samurai (Japan), Parsees, Marwaris and Gujaratis (India), Yoruba (Nigeria) and Halai Memons (Pakistan) have been foundations of entrepreneurship.</li>
<li><b>Socio-cultural values:</b> environmental, institutional and cultural factors determine how a business starts. Sociocultural values foster an environment where <b>risk-taking, innovation and self-reliance</b> are encouraged.</li>
<li><b>Openness of the culture:</b> flexibility in the social and cultural system helps; entrepreneurs grow in a liberal society.</li>
<li><b>Cultural marginality:</b> religious or cultural differences can push groups into entrepreneurial roles.</li>
<li><b>Child-rearing (Hagen):</b> authoritarian child-rearing produces uncreative personalities.</li>
</ol>
<h4>Conclusion</h4>
<p>Culture shapes the entrepreneur's personality and the social support for enterprise, along with economic factors.</p>`,
src:"Unit-1 part 1.pdf p5, p8, p10-11; factors.pdf p3, p5; Question Bank"},

{id:"F6",s:"F",tags:[],st:"full",
q:"Explain the role of government and other factors (infrastructure, environmental scanning, training) in entrepreneurship growth.",
a:()=>`<h4>Government / Political Approach</h4>
<p>All economic, social and psychological factors are influenced by the <mark>actions of government</mark>. Through policy initiatives (economic policies, social schemes and training programmes), government provides a congenial environment:</p>
<ol>
<li>creating basic facilities and services for entrepreneurship,</li>
<li>developing <b>special economic zones, industrial areas and industrial estates</b>,</li>
<li>in India, enacting the <b>MSMED Act 2006</b>, establishing a separate <b>Ministry for MSME</b>, and launching attractive schemes.</li>
</ol>
<p>If government is inactive, <b>there will be no growth</b> in entrepreneurship.</p>
${D.tree("Government and other factors","Government & Other Factors",[["Government","SEZs, industrial estates, MSMED Act 2006, schemes"],["Infrastructure","e.g. cold store or warehouse"],["Environmental Scanning","SWOT, customers' needs"],["Training","knowledge, skills, N-Ach"]])}
<h4>Infrastructural Development</h4>
<p>Poor infrastructure negatively affects the entrepreneur's psychology, while sound infrastructure can <b>nullify location problems</b>. <i>Example: a small horticulturist in a hill town with no cold store may quit, but a warehouse or cold store boosts such enterprises.</i></p>
<h4>Environmental Scanning</h4>
<p>Careful research of the environment gives the enterprise's <b>strengths, weaknesses, opportunities and threats</b>, and the target customers' needs and shopping habits. Entrepreneurs often fail because of poor analysis.</p>
<h4>Training</h4>
<p>Initiatives fail because of poor knowledge, weak implementation and lack of skills. Training gives knowledge and skills, <mark>creates a high need for achievement</mark>, motivates initiative, and builds competencies.</p>
<h4>Conclusion</h4>
<p>Entrepreneurship flourishes only where government takes proactive steps, supported by infrastructure, environmental analysis and training.</p>`,
src:"factors.pdf p6-7 (Sections 7, 8, 9)"},

{id:"G1",s:"G",tags:["imp"],st:"full",
q:"Explain institutional support to entrepreneurs / the major entrepreneurship support system in India.",
a:()=>`<h4>Introduction</h4>
<p>A support system is the <mark>backbone</mark> for an enterprise to be successful. In India, several institutions and schemes support entrepreneurs.</p>
${D.mind("Major entrepreneurship support institutions in India","INSTITUTIONAL SUPPORT",["Startup India (2016)","Atal Innovation Mission","MSME Programme","NSDC","SIDBI","NABARD (1982)","Invest India","R&D Support"])}
<ol>
<li><b>Startup India:</b> launched on <mark>16 January 2016</mark> to promote and support start-ups by providing bank finance; organised by the Department for Promotion of Industry and Internal Trade.</li>
<li><b>Atal Innovation Mission (AIM):</b> set up by <b>NITI Aayog in 2016</b> to build an environment of innovation and entrepreneurship across schools, institutes and industries, including MSMEs.</li>
<li><b>MSME Support and Development Programme:</b> supports micro, small and medium enterprises for the growth of the sector.</li>
<li><b>NSDC (National Skill Development Corporation):</b> gives funding support to enterprises to build capacity through resources, technical assistance and knowledge management.</li>
<li><b>SIDBI:</b> an independent financial institution aiding MSMEs, which contribute significantly to production, employment and exports.</li>
<li><b>NABARD:</b> India's apex development bank, set up in <mark>1982</mark> under an Act of Parliament for sustainable agriculture and rural development. It gives working capital, term and crop loans.</li>
<li><b>Invest India:</b> the National Investment Promotion and Facilitation Agency; helps establish, operate and expand businesses.</li>
<li><b>Research &amp; Development Support:</b> efforts to gather knowledge to create new products and improve existing ones.</li>
</ol>
<p><b>Other schemes in the material:</b> Mudra Bank, Startup India Seed Fund, Digital India, Stand-Up India, DDU-GKY, RSETI and Make in India.</p>
<h4>Conclusion</h4>
<p>These institutions provide finance, skills, innovation support and a favourable environment for entrepreneurs.</p>`,
src:"Unit 2 ENTREPRENEURSHIP SUPPORT SYSTEM.pdf p10, p12-13 (2.6-2.8); Teacher IMP note (item 4)"},

{id:"G2",s:"G",tags:["saq"],st:"full",
q:"What is an entrepreneurship support system? Explain its major components.",
a:()=>`<h4>Meaning</h4>
<p>An entrepreneurship support system refers to the <mark>infrastructure, resources and services available to assist entrepreneurs at different stages</mark>, from the idea phase to establishing and scaling a business. It includes institutions, programmes and stakeholders. Support can be <b>tangible</b> (money, material) or <b>intangible</b> (emotional, psychological). Without it, there is no entrepreneurship at all.</p>
${D.mind("Components of the entrepreneurship support system","SUPPORT SYSTEM",["Financial support & capital","Training & skill development","Networking & market access","Regulatory & policy support","Technical & technological","Legal & advisory","Marketing & branding","Diverse entrepreneurs","Export support"])}
<ol>
<li><b>Financial support:</b> bank loans, microfinance, VC, angel investors, grants, impact investing.</li>
<li><b>Training and capacity building:</b> workshops, business development programmes, online learning, mentorship, incubators and accelerators.</li>
<li><b>Networking and market access:</b> chambers of commerce, trade fairs, co-working spaces, pitching events, B2B marketplaces.</li>
<li><b>Regulatory and policy support:</b> simplified registration, tax incentives, IP protection, supportive labour laws.</li>
<li><b>Technical and technological support:</b> innovation hubs, R&amp;D funding, IT support.</li>
<li><b>Legal and advisory services:</b> legal clinics, business consulting, accounting and tax support.</li>
<li><b>Marketing and branding support:</b> digital marketing tools, government/NGO marketplaces, PR support.</li>
<li><b>Support for diverse entrepreneurs:</b> women, youth and minority, and rural programmes.</li>
<li><b>Market access and export support:</b> e-commerce, export assistance, export credit agencies.</li>
</ol>
<h4>Conclusion</h4>
<p>The support system is the <b>platform on which an entrepreneur builds the enterprise</b>, from start-up to maturity.</p>`,
src:"Unit 2 p1-8 (2.1, 2.3, 2.4), p14 (Check Your Progress Q4)"},

{id:"G3",s:"G",tags:["qb"],st:"full",
q:"Explain the availability of financial support and access to capital for startups.",
a:()=>`<h4>Introduction</h4>
<p>Access to economic resources is a critical factor for the growth, innovation and sustainability of startups. <mark>Financial constraints are one of the biggest hurdles for entrepreneurs.</mark> Various sources of finance meet different needs.</p>
${D.tree("Sources of financial support for startups","FINANCIAL SUPPORT",[["Bank Loans & Microfinance","expansion, working capital"],["Venture Capital","funds in exchange for equity"],["Angel Investors","high-net-worth individuals"],["Govt. Grants & Subsidies","non-repayable"],["Impact Investing","social + financial return"]])}
<ol>
<li><b>Bank Loans and Microfinance:</b> banks lend for expansion, working capital or equipment. <b>Microfinance</b> serves low-income and underprivileged people who lack financial services.</li>
<li><b>Venture Capital:</b> funds for start-ups and emerging companies <mark>in exchange for equity</mark>, provided at early stages to firms with high growth potential.</li>
<li><b>Angel Investors:</b> high-net-worth individuals who back start-ups in early stages for equity or convertible debt. They suit start-ups with promising ideas but limited access to institutional funding.</li>
<li><b>Government Grants and Subsidies:</b> <b>non-repayable</b> assistance for specific sectors or communities; subsidies reduce costs.</li>
<li><b>Impact Investing:</b> investment for social or environmental impact plus financial return, through stocks, bonds, mutual funds or microloans.</li>
</ol>
<h4>Supporting Institutions</h4>
<p><b>SIDBI, Mudra Bank, Startup India Seed Fund Scheme</b>, NABARD (working capital, term and crop loans) and <b>Stand-Up India</b> (women and underrepresented groups). Self-help groups (SHGs) give women microloans. <b>Tax incentives</b> improve early-stage cash flow.</p>
<h4>Conclusion</h4>
<p>A range of financial sources helps startups overcome their biggest hurdle, the lack of capital.</p>`,
src:"Unit 2 p3-4, p6, p10-12; Question Bank"},

{id:"G4",s:"G",tags:["qb"],st:"full",
q:"Explain technical and technological support for startups.",
a:()=>`<h4>Introduction</h4>
<p>Technical and technological support means <mark>spaces designed to foster creativity, collaboration and innovation</mark>. They often house startups, researchers and academic institutions.</p>
${D.tree("Technical and technological support","TECHNICAL SUPPORT",[["Innovation Hubs & Research Parks","support for research, innovation, product development"],["R&D Funding","finance for research and new products"],["IT Support & Digital Assistance","software, hardware, digital tools"]])}
<h4>Main Components</h4>
<ol>
<li><b>Innovation Hubs and Research Parks:</b> these give entrepreneurs the financial support available for research, innovation and product development.</li>
<li><b>Access to R&amp;D Funding:</b> financial support for <mark>research, innovation and product development</mark>.</li>
<li><b>IT Support and Digital Assistance:</b> help to use IT solutions (software, hardware and digital tools) for business needs.</li>
</ol>
<h4>Related Technological Support</h4>
<ol>
<li><b>Incubators and Accelerators:</b> provide infrastructure, resources and short, intensive programmes for rapid growth.</li>
<li><b>Digital India:</b> entrepreneurs in rural and remote areas can access technology, <b>e-commerce, digital payments</b> and marketing platforms.</li>
<li><b>Technology and Innovation:</b> streamlines operations, reaches customers and helps adapt to market changes.</li>
<li><b>Atal Innovation Mission</b> and <b>R&amp;D Support</b>.</li>
<li><b>Digital marketing training and tools</b> and <b>e-commerce platforms</b>.</li>
</ol>
<h4>Conclusion</h4>
<p>Technological support helps startups innovate, go digital and scale.</p>`,
src:"Unit 2 p4, p6, p7-10, p12-13; Question Bank"},

{id:"G5",s:"G",tags:["saq"],st:"full",
q:"Describe the objectives of the entrepreneurship support system.",
a:()=>`<h4>Introduction</h4>
<p>The entrepreneurship support system aims to <mark>nurture entrepreneurial efforts by providing critical resources and a favourable environment</mark>.</p>
${D.tree("Objectives of the entrepreneurship support system","OBJECTIVES",["Promote Innovation & Entrepreneurship","Capacity Building & Skill Development","Access to Funding","Business Development & Growth","Sustainable & Inclusive Practices"])}
<ol>
<li><b>Promote Innovation and Entrepreneurship:</b> foster innovation by providing <b>resources, guidance and a sustaining environment</b> for aspiring entrepreneurs to develop new ideas and business models.</li>
<li><b>Capacity Building and Skill Development:</b> offer training and workshops to build <b>technical, managerial and leadership</b> abilities for business challenges.</li>
<li><b>Access to Funding and Financial Resources:</b> give access to capital through <mark>grants, loans, venture capital, angel investors and crowdfunding</mark>.</li>
<li><b>Support for Business Development and Growth:</b> provide resources for marketing, sales, legal and operational needs so businesses scale and sustain growth.</li>
<li><b>Encourage Sustainable and Inclusive Business Practices:</b> support enterprises focused on <b>social impact, environmental sustainability and inclusive employment</b>.</li>
</ol>
<h4>Conclusion</h4>
<p>These objectives help people turn ideas into viable, successful businesses and create a sustainable economic impact.</p>`,
src:"Unit 2 p8-9 (2.5), p13 (2.9), p14 (Check Your Progress Q5)"},

{id:"G6",s:"G",tags:["saq"],st:"full",
q:"What is the importance of entrepreneurship in India? How is it important for job creation and economic growth?",
a:()=>`<h4>Introduction</h4>
<p>Entrepreneurship reduces major problems such as <mark>vast unemployment, poverty, heavy dependence on agriculture and regional imbalances</mark>. Countries are shifting from agriculture-driven to entrepreneurship-driven economies.</p>
${D.mind("Importance of entrepreneurship in India","IMPORTANCE IN INDIA",["Job creation & economic growth","Innovation & competitiveness","Access to funding","Digital support","Women & marginalised groups","Rural & small-scale","Community & social impact","Environmental responsibility"])}
<ol>
<li><b>Economic Growth and Job Creation:</b> India has a <mark>large working-age population</mark>. Entrepreneurship creates jobs and boosts economic activity, and supporting startups and SMEs reduces dependence on traditional sectors for employment.</li>
<li><b>Innovation and Competitiveness:</b> solutions in technology, agriculture and healthcare enhance India's global competitiveness.</li>
<li><b>Access to Funding:</b> venture capital, angel investment, grants; SIDBI, Mudra Bank, Startup India Seed Fund.</li>
<li><b>Digital and Technological Support:</b> Digital India helps rural entrepreneurs through e-commerce and digital payments.</li>
<li><b>Women and Marginalised Groups:</b> Stand-Up India gives finance and mentorship.</li>
<li><b>Rural and Small-Scale:</b> prevents urban migration and boosts rural economies (DDU-GKY, RSETI).</li>
<li><b>Community Support and Social Impact:</b> ventures in green technology, education and health gain community support.</li>
<li><b>Environmental Responsibility:</b> eco-friendly practices attract customers and save costs.</li>
</ol>
<h4>Conclusion</h4>
<p>The USA and China enjoy economic and social benefits from entrepreneurship growth. For India too, it drives jobs, growth and inclusive development.</p>`,
src:"Unit 2 p9-10 (2.6), p14 (Q6); factors.pdf p2; Unit-1 part 1.pdf p18 (SAQ 4)"},

{id:"G7",s:"G",tags:[],st:"full",
q:"Explain the support and sustainability of entrepreneurship.",
a:()=>`<h4>Introduction</h4>
<p>Supporting and sustaining entrepreneurship involves <mark>creating a conducive environment where entrepreneurs can thrive over the long term</mark>.</p>
${D.mind("Support and sustainability of entrepreneurship","SUSTAINABLE ENTREPRENEURSHIP",["Access to financing","Skill development","Mentorship & networking","Market access & diversification","Supportive policy","Training programmes","Regulatory support"])}
<ol>
<li><b>Access to Financing:</b> microfinance, venture capital, grants and loans. Women benefit from dedicated funds and microloans through <b>self-help groups (SHGs)</b>.</li>
<li><b>Skill Development and Training:</b> financial literacy, digital marketing, operations and management. Continuous learning helps adaptation and productivity.</li>
<li><b>Mentorship and Networking:</b> guidance, shared experiences, partnerships and new markets.</li>
<li><b>Market Access and Diversification:</b> local, national and international markets <mark>reduce dependence on a single market</mark> and expand revenue.</li>
<li><b>Supportive Policy and Regulatory Environment:</b> fewer regulatory burdens, tax incentives, and policies for specific groups such as women.</li>
<li><b>Training and Skill Development:</b> training programmes, workshops and incubators build business management, finance and marketing skills.</li>
<li><b>Policy and Regulatory Support:</b> simplified procedures; <b>Make in India, Startup India</b> and ease-of-doing-business reforms.</li>
</ol>
<h4>Conclusion</h4>
<p>By investing in support systems, communities create a sustainable economic impact, stimulate innovation and strengthen resilience against economic downturns.</p>`,
src:"Unit 2 p11-13 (2.7, 2.9)"},

{id:"H1",s:"H",tags:["qb","imp"],st:"full",
q:"What is Venture Capital? What are the limitations associated with risk capital equity to the startups?",
a:()=>`<h4>Meaning of Venture Capital</h4>
<p>Venture capital may be defined as <mark>long-term equity investment in new business which has potential for tremendous growth</mark> in business and financial returns.</p>
<p>Since venture capital is part of long-term <b>owned funds</b>, the investors who provide it bear the risk of the business. That is why it is also called <mark>risk capital</mark>.</p>
<p>Venture capital is provided by <b>high net worth investors, investment banks and commercial banks</b> who invest in young, rapidly growing companies that could become economic powerhouses. Unit 2 describes it as funds given to start-ups <b>in exchange for equity</b>.</p>
${D.flow("Concept of venture capital (risk capital)",[["Investors","HNIs, investment banks, commercial banks"],["Long-term equity investment","owned funds, investor bears the risk"],["New / young high-growth business","start-up gets capital; investor gets a stake"]])}
<h4>Limitations of Risk Capital Equity</h4>
${D.tree("Limitations of venture capital","LIMITATIONS",[["Dilution of Ownership & Control","VC takes a stake in ownership"],["Early Redemption","within 3-5 years, for capital gains"],["Long & Complicated Process","detailed business plan analysed"]])}
<ol>
<li><b>Dilution of Ownership and Control of Promoters:</b> the venture capitalist provides huge equity capital to the start-up <mark>in return for a stake in the ownership</mark> of the venture capital undertaking, so the promoters lose part of their ownership and control.</li>
<li><b>Early Redemption of Venture Capital:</b> the investor may decide to redeem the investment within <b>3 to 5 years</b> of inception, because the investor's primary focus is to earn <b>capital gains</b>.</li>
<li><b>Long and Complicated Process:</b> the start-up's promoter must submit a <b>detailed business plan</b>, which the venture capital investors then analyse from various angles, making the process long and complicated.</li>
</ol>
<h4>Conclusion</h4>
<p>Venture capital is valuable risk capital for start-ups, but it costs the promoters some ownership and control and involves a lengthy process.</p>`,
src:"ing.pdf (Financing Venture Capital) slides 3, 6; Unit 2 p3; Teacher IMP note (item 6); Question Bank 5-mark Q1"},

{id:"H2",s:"H",tags:["qb","imp"],st:"full",
q:"Venture capital finance provides lots of benefits to venture capital undertakings. Explain these benefits in detail.",
a:()=>`<h4>Introduction</h4>
<p>Venture capital is long-term equity (risk capital) given to new, high-growth businesses. Besides finance, it gives the <b>venture capital undertaking</b> (the start-up) several benefits.</p>
${D.mind("Benefits of venture capital","BENEFITS OF VENTURE CAPITAL",["Opportunity","Guidance","Networks","No obligation to repay","Easy to identify"])}
<ol>
<li><b>Opportunity:</b> venture capital gives the undertaking an <mark>opportunity to set up a new business carrying higher risk</mark> and to undertake expansion of the business.</li>
<li><b>Guidance:</b> besides long-term finance, venture capital brings <b>valuable guidance and expertise</b>. A member of the venture capital fund or firm is usually appointed as a <mark>nominated director</mark> of the start-up.</li>
<li><b>Networks:</b> venture capitalists have a <b>large network of connections</b> in the business world, which indirectly helps start-ups grow and succeed.</li>
<li><b>No Obligation:</b> there is <mark>no obligation to repay</mark> the venture capital if the start-up fails or closes down. Hence venture capital is essential for start-ups and high-risk ventures.</li>
<li><b>Easy to Identify:</b> venture capital funds are <b>registered with the regulator</b> and documented in directories, which reduces the time, effort and money spent searching.</li>
</ol>
<h4>Additional advantages (from the features)</h4>
<ul>
<li>It suits <b>technically or professionally qualified</b> promoters who lack funds.</li>
<li>It supports <b>innovation</b> in technology, production process and product design, giving an edge over competitors.</li>
<li>It is <b>long-term</b> finance.</li>
</ul>
<h4>Conclusion</h4>
<p>Venture capital gives start-ups not only money but also guidance, networks and freedom from repayment, which helps develop entrepreneurship.</p>`,
src:"ing.pdf slides 4-5; Teacher IMP note (item 6); Question Bank 5-mark Q4"},

{id:"H3",s:"H",tags:["qb"],st:"full",
q:"Explain the pros and cons of venture capital finance.",
a:()=>`<h4>Introduction</h4>
<p>Venture capital is <mark>long-term equity investment (risk capital)</mark> in new businesses with high growth potential. It has both advantages and limitations.</p>
${D.two("Pros and cons of venture capital",["PROS (Benefits)",["Opportunity to start a high-risk business and expand","Guidance; nominated director","Networks of business connections","No obligation to repay if the venture fails","Easy to identify (registered)","Long-term finance for innovative, qualified promoters"]],["CONS (Limitations)",["Dilution of ownership and control","Early redemption in 3-5 years","Long and complicated process","High risk (feature)","Illiquid: locked for 3-5 years (feature)"]])}
<h4>Pros</h4>
<ol>
<li><b>Opportunity:</b> set up a high-risk new business and expand it.</li>
<li><b>Guidance:</b> expertise; a VC member serves as <b>nominated director</b>.</li>
<li><b>Networks:</b> large business connections help growth.</li>
<li><b>No obligation:</b> <mark>no repayment if the start-up fails</mark>.</li>
<li><b>Easy to identify:</b> registered with the regulator, listed in directories.</li>
</ol>
<h4>Cons</h4>
<ol>
<li><b>Dilution of ownership and control:</b> the VC takes a stake in return for equity.</li>
<li><b>Early redemption:</b> within 3-5 years, as investors focus on <b>capital gains</b>.</li>
<li><b>Long and complicated process:</b> a detailed business plan is analysed from various angles.</li>
<li class="note">High risk and 3-5 year illiquidity are drawn from the Features slide; the material lists only three formal limitations.</li>
</ol>
<h4>Conclusion</h4>
<p>Venture capital suits high-risk, innovative start-ups, but promoters must accept some loss of control and a lengthy selection process.</p>`,
src:"ing.pdf slides 4-6; Question Bank (additional topic)"},

{id:"H4",s:"H",tags:[],st:"full",
q:"Explain the features of venture capital finance.",
a:()=>`<h4>Introduction</h4>
<p>The venture capital market comprises new entrepreneurs and enterprises, banks, venture capital funds, high net worth individuals and the regulator. Venture capital finance <mark>helps develop entrepreneurship and exploits untested technology</mark>.</p>
${D.tree("Features of venture capital finance","FEATURES",[["Competent & Capable","qualified promoters lacking funds"],["Innovations","technology, process, product design"],["High Risk, High Return",""],["Long Term","locked 3-5 years, illiquid"]])}
<ol>
<li><b>Competent and capable promoters:</b> venture capital is given to promoters who are <mark>technically and/or professionally qualified, competent and capable</mark> of launching and running a new business but do not have adequate funds.</li>
<li><b>Innovations:</b> the venture brings many innovations in the <b>use of technology, production process and product design</b>, which gives it an advantage over competitors.</li>
<li><b>High risk and high return:</b> venture capital investment carries <mark>high risk and high return</mark>, so only investors prepared to take high risk and expecting high return invest.</li>
<li><b>Long term:</b> the investment is for a longer period. It is initially <b>locked up for about 3 to 5 years</b> from the date of investment, and during this period it is considered <b>illiquid</b>.</li>
</ol>
<h4>Conclusion</h4>
<p>Venture capital is long-term, high-risk, high-return finance for innovative ventures run by competent promoters.</p>`,
src:"ing.pdf slides 2, 4"},

{id:"H5",s:"H",tags:[],st:"full",
q:"Differentiate between Venture Capital Finance and Private Equity Finance.",
a:()=>`<h4>Introduction</h4>
<p><b>Venture capital finance</b> means small investments used to grow companies in their <mark>early stage</mark>. <b>Private equity finance</b> means investment in firms that are <mark>not listed on any recognised stock exchange</mark>.</p>
${D.flow("Stage of investment: VC vs PE",[["VENTURE CAPITAL","initial stage, high risk, many firms"],["PRIVATE EQUITY","later stage, low risk, few companies"]],'h')}
<h4>Differences</h4>
<table><tr><th>Parameters</th><th>Venture Capital Finance</th><th>Private Equity Finance</th></tr>
<tr><td>Meaning</td><td>Small investments to grow companies in their early stage</td><td>Investments in firms not listed on any recognised stock exchange</td></tr>
<tr><td>Investment stage</td><td>Initial stage</td><td>Later stage</td></tr>
<tr><td>Fund invested</td><td>In a large number of firms</td><td>In a few companies</td></tr>
<tr><td>Types of industries</td><td>High technology, energy conservation, etc. that need initial investment</td><td>All types of industries</td></tr>
<tr><td>Focus on</td><td>Management skill</td><td>Corporate governance</td></tr>
<tr><td>Risk involved</td><td>High</td><td>Low</td></tr>
<tr><td>Capital required</td><td>For day-to-day operations and business growth</td><td>For business expansion and growth</td></tr>
</table>
<h4>Conclusion</h4>
<p>Venture capital supports <b>young, high-risk</b> companies in many firms, while private equity supports <b>established unlisted</b> companies at a later stage with lower risk.</p>`,
src:"ing.pdf slides 7-10 (image table)"},

{id:"H6",s:"H",tags:[],st:"full",
q:"Explain the structure of the venture capital industry. Why is venture capital called risk capital?",
a:()=>`<h4>Venture Capital Market</h4>
<p>The venture capital market comprises <mark>new entrepreneurs and enterprises, banks, venture capital funds, high net worth individuals and the regulator</mark>. To encourage entrepreneurs to set up new enterprises based on scientific technology and knowledge, it is necessary to promote the venture capital market.</p>
<h4>Structure of the Venture Capital Industry</h4>
<p>A venture capital fund can be formed as a <b>Trust</b>, a <b>Company</b> or a <b>Body Corporate</b>.</p>
${D.tree("Structure of the venture capital industry","VENTURE CAPITAL FUND (Trust / Company / Body Corporate)",["Financial institutions","Banks","Pension funds","Corporations","High net worth individuals"])}
<p>Investors in venture capital funds are:</p>
<ol>
<li>Financial institutions</li>
<li>Banks</li>
<li>Pension funds</li>
<li>Corporations</li>
<li>High net worth individuals, etc.</li>
</ol>
<h4>Why is it called Risk Capital?</h4>
<p>Venture capital is <b>long-term equity investment</b> in new businesses with high growth potential. Since it is part of long-term <mark>owned funds</mark>, the investors who provide it <mark>bear the risk in the business</mark>. There is no obligation to repay if the start-up fails, and the investment carries high risk and high return. Hence it is called <b>risk capital</b>.</p>
<h4>Conclusion</h4>
<p>Venture capital helps develop entrepreneurship and exploits <b>untested technology</b> to produce goods or provide technology-oriented services.</p>`,
src:"ing.pdf slides 2-5, 11"},

/* =================== REAL-WORLD EXAMPLES =================== */
const EXL = {
  mat:["t-mat","From your material"],
  mix:["t-mix","Material + illustration"],
  ill:["t-ill","Illustrative - added for understanding, not from material"]
};
const EX = {
A1:["ill",`Imagine a young professional who leaves a salaried job and uses personal savings to open a cloud kitchen, because she notices that office workers nearby want healthy home-style food delivered. She has no guaranteed income (she <b>assumes risk</b>), she spotted an unmet need (she <b>explores an opportunity</b>), and her kitchen serves food that did not exist in that area before (she <b>creates value</b>). This matches the definition: the capacity to assume risk, accountability and challenges to explore opportunities and create value.`],
A2:["mix",`A vegetable trader who buys at a fixed price in the wholesale mandi and sells in the retail market at a price he cannot know in advance is exactly Cantillon's <b>risk-bearer</b>. A factory owner who brings together land, workers and machines is Say's <b>coordinator of factors of production</b>. Products such as Tesla and the iPhone (examples given in the material) show Schumpeter's <b>innovator</b>, who brings something new to the market.`],
A3:["ill",`Think of studying one start-up founder through each phase. Early economists would ask how she <b>bore risk and coordinated resources</b> (rational agent). Trait researchers would ask whether she has a <b>need for achievement or self-confidence</b> (personality traits). Later scholars would ask <b>how she spotted the gap</b> in the market (opportunity recognition), and then which <b>incubator, family network or government scheme</b> helped her (institutions and networks). Today the constructivist approach looks at <b>all of these together</b>: the person, the project and the environment.`],
A4:["mix",`The material gives Tesla as an example of innovation entrepreneurship. An electric car is a way of "producing an old one (a car) in a new way", which is exactly how Schumpeter says an entrepreneur <b>revolutionizes the pattern of production</b>. In daily life, an online grocery app that delivers from local shops is also a <b>new business model</b> that changes how an old service is provided.`],
B1:["mix",`The material says <b>Paul Buchheit created Gmail</b> as an employee, and <b>Ken Kutaragi created PlayStation at Sony</b>. The company paid for the work, bore the risk and owns the product, so they were <b>intrapreneurs</b>. By contrast, a person who quits a job and launches their own gaming studio with their own savings bears all the risk and owns the business. That person is an <b>entrepreneur</b>.`],
B2:["ill",`A person who decides to open a chain of restaurants, invests the money and bears the loss if it fails is the <b>entrepreneur</b>. The branch manager who is paid a monthly salary to handle staff rosters, stock and daily customer service is the <b>manager</b>. The owner looks outward at market trends and new locations, while the manager looks inward at running the branch efficiently.`],
C1:["mix",`Suppose a student in India wants to start a business. An <b>economist</b> would study her access to capital and market, a <b>psychologist</b> her need for achievement and locus of control, a <b>sociologist</b> her family and social network, and an <b>anthropologist</b> her community's culture. The material notes, for example, the business tradition of Marwaris, Gujaratis and Parsees. Each theory explains a different part of the same entrepreneur.`],
C2:["mix",`The material lists the iPhone and Tesla as innovation entrepreneurship. The iPhone combined a phone, music player and internet device into one product, a <b>novel combination</b> of existing technologies. An electric car introduced a <b>new product and new process</b> into an old industry. The inventor of a new battery chemistry may only publish it, but the entrepreneur who <b>turns it into a saleable product</b> is Schumpeter's innovator.`],
C3:["ill",`A student who keeps setting higher targets, prepares on her own, welcomes feedback from teachers and chooses challenging but achievable goals shows a <b>high need for achievement</b>. When she later starts a coaching centre, her main motivation is the <b>satisfaction of building something successful</b>, not only the money. This matches McClelland's five components of N-Ach.`],
C4:["ill",`Consider a founder who launches a new app that changes how people pay small shops. Schumpeter would say she is an <b>innovator creating a new combination</b> that disturbs the old market. McClelland would ask <b>why</b> she took this risk and answer: her strong <b>need for achievement</b>. One explains the economic effect, the other the psychological drive.`],
C5:["ill",`Two shop owners face falling sales. The first says, "It is just bad luck this season," and waits (<b>external locus of control</b>). The second says, "My display and prices must change," and starts home delivery and online orders (<b>internal locus of control</b>). The second behaves like the successful entrepreneurs described in the theory.`],
C6:["ill",`A person who keeps money in a bank fixed deposit earns a small but certain return. If she instead opens a new café, she can insure the building against fire (an <b>insurable risk</b>), but nobody can insure her against customers <b>not liking her menu</b> (an <b>uncertainty</b>). According to Knight, the profit she earns if the café succeeds is her <b>reward for bearing this non-insurable uncertainty</b>.`],
C7:["mix",`The material's own example is the <b>Japanese samurai</b>. They lost their traditional respect and status, and in trying to regain it they became active in business and produced many entrepreneurs. Similarly, a family that migrates to a new city and does not receive the respect it expected may start a business to <b>rebuild its identity and status</b>, which is Hagen's "innovator" response.`],
C8:["mat",`The material notes that communities such as the <b>Parsees, Marwaris and Gujaratis in India</b>, the samurai in Japan and the Halai Memons in Pakistan have served as foundations of entrepreneurship. In such communities, business is a respected, expected role. Children grow up seeing trade as honourable, which is Cochran's <b>"model personality"</b> formed by cultural values and role expectations.`],
C9:["ill",`A young person from a migrant community opens a textile shop. Relatives lend money and refer customers because of <b>trust (social networks)</b>. Her earlier job in a shop gave her experience (<b>life course stage</b>), and her community's difficult background pushes her to succeed (<b>ethnic identification</b>). But local rules, rent, competitors and customers decide whether the shop survives (<b>population ecology</b>).`],
C10:["ill",`When smartphones and cheap mobile internet spread, some people <b>perceived</b> that busy customers wanted meals delivered. They <b>discovered</b> a fit between this need and the unused capacity of local restaurants, and <b>created</b> a business concept: an app connecting them. They did not create the smartphone change; they <b>responded to it and exploited it</b>, as Drucker says.`],
C11:["ill",`A trader notices that a handmade product sells cheaply in a small town but at a much higher price in a big city, a gap that others overlooked. By buying in the town and selling in the city, he earns a profit and also brings the two prices closer together. This is Kirzner's <b>entrepreneurial alertness</b>: the "antenna" that spots price differences and market imperfections.`],
C12:["ill",`A bakery has ovens (<b>physical resources</b>), trained bakers (<b>human resources</b>), savings (<b>financial</b>) and a good local name (<b>reputational</b>). By baking the same recipes every day in a fixed routine, the team becomes faster and more consistent (<b>routines and economies of experience</b>). This <b>capability</b> is hard for a new competitor to copy, so it becomes the bakery's competitive advantage.`],
C13:["mix",`The material's own example is cooking with <b>whatever ingredients are at hand</b> rather than buying ingredients for a fixed menu. In business, a college student with a laptop, design skills and a few friends does not wait to write a perfect plan. She starts freelance design using what she has, limits her spending to what she can <b>afford to lose</b>, and partners with a friend who does marketing. The business grows from the means available.`],
C14:["ill",`A roadside tea stall owner with little money uses old wooden crates as seats, takes orders on WhatsApp and borrows a friend's bike for delivery. Instead of complaining about lack of resources, he <b>improvises with whatever is available</b>, and over time his stall grows. This is entrepreneurial <b>bricolage</b>, which the material says is common in microbusinesses and SMEs.`],
D1:["mat",`The material itself gives real examples: a <b>local milk kiosk, grocery store or salon</b> (small business), <b>Apple and Samsung</b> (large company), <b>Tesla and the iPhone</b> (innovation), <b>fast food restaurants</b> (imitative, often franchises), <b>non-profit organisations</b> (social), <b>audiobooks and SaaS software</b> (environmental), and <b>online retail and OTT services</b> (cyber entrepreneurship).`],
D2:["mix",`The material gives <b>Tesla and the iPhone</b> as innovation entrepreneurship: novel products that nobody had offered in that form before. A <b>researcher entrepreneur</b> is like a person who, before opening a gym, surveys the neighbourhood, counts nearby competitors, studies membership prices and prepares a detailed plan, depending on <b>data rather than gut feeling</b>.`],
D3:["ill",`Picture a young founder who starts a small organic food brand. She sets tough sales goals and tracks them (<b>need for achievement</b>). She believes her own effort decides the result (<b>internal locus of control</b>) and invests her savings (<b>risk-taking</b>). She designs new eco-friendly packaging (<b>innovativeness</b>) and leads a small team with confidence (<b>self-confidence and leadership</b>). Each action shows one trait from the answer.`],
D4:["ill",`One person starts a business because she wants to <b>prove she can build something big</b> (need for achievement). Another, whose family migrated and lost its social standing, starts a shop to <b>regain respect</b> (status withdrawal). A third notices that online classes became popular and <b>seizes the change as an opportunity</b>. All of them are encouraged when a bank loan, training programme or government scheme is available (<b>supportive environment</b>).`],
E1:["ill",`Riya notices that her college area has no healthy snack shop (<b>1. identify and evaluate the opportunity</b>). She writes a plan with her vision, menu, costs and capital needed (<b>2. business plan</b>). She arranges a bank loan and hires two helpers (<b>3. resources</b>). She opens the shop and decides who handles purchase, cooking and billing (<b>4. manage the enterprise</b>). After a year she compares actual and planned sales and decides to <b>open a second outlet</b> (<b>5. harvesting</b>). Later she repeats the process for a new juice brand.`],
E2:["ill",`<i>(Illustrates only the related evaluation questions from the material, not "screening techniques".)</i> Before opening a juice bar near a college, a person asks: Is it <b>worth investing in</b>? Will students find it <b>attractive</b>? Is it <b>feasible</b> to get fresh fruit daily? Do I have a <b>competitive advantage</b> over the canteen? What is the <b>risk</b> if students go home during vacations?`],
F1:["mat",`The material gives two clear examples. A <b>furniture maker</b> who arranges capital and skilled labour will still fail if <b>no timber</b> is available nearby (economic factor: raw material). A <b>small horticulturist in a hill town</b> may leave the business if there is no cold store, but a proper warehouse or cold store <b>boosts such enterprises</b> (other factor: infrastructure). In India, the government's <b>MSMED Act 2006</b> and MSME ministry show the government factor.`],
F2:["mat",`From the material: a <b>furniture house</b> fails without nearby <b>timber</b> (raw material). <b>Japan and the USA</b> solved labour problems through labour-saving technology (labour). The rapid development of markets increased the number of entrepreneurs in <b>Germany and Japan</b> (market). Entrepreneurship grows with the supply of capital, as in the <b>USA, China, Russia and France</b> (capital).`],
F3:["mix",`The material notes that when <b>young, educated people move out of a region and later return</b>, entrepreneurship grows there (social mobility). For example, a youth who works in a city for some years and returns to his village may open a repair shop or dairy unit with the skills he learned. In a community where running a business is <b>respected</b> (high legitimacy) and members <b>support each other</b> (solidarity), more people take up entrepreneurship.`],

function keyMarks(h){
  const ms=[...h.matchAll(/<mark>([\s\S]*?)<\/mark>/g)].map(m=>m[1]);
  const keep=new Set();
  const byLen=[...new Set(ms)].sort((a,b)=>b.replace(/<[^>]+>/g,'').length-a.replace(/<[^>]+>/g,'').length);
  if(byLen[0] && byLen[0].replace(/<[^>]+>/g,'').length>=25) keep.add(byLen[0]);
  if(byLen[1] && byLen[1].replace(/<[^>]+>/g,'').length>=70) keep.add(byLen[1]);
  const done=new Set();
  return h.replace(/<mark>([\s\S]*?)<\/mark>/g,(m,x)=>{ if(keep.has(x)&&!done.has(x)){done.add(x);return m;} return x; });
}
function addExample(h,id){
  const e=EX[id]; if(!e) return h;
  const block=`<h4 class="exh">Real-World Example <span class="tag ${EXL[e[0]][0]}">${EXL[e[0]][1]}</span></h4><p class="ex">${e[1]}</p>`;
  const i=h.lastIndexOf('<h4>Conclusion</h4>');
  return i>-1 ? h.slice(0,i)+block+h.slice(i) : h+block;
}
function mapRefs(h){ return h.replace(/Q\.\s?([A-H]\d{1,2})\b/g,(m,id)=>NO[id]?`Q.${NO[id]}`:m); }
function prep(q){ return mapRefs(addExample(keyMarks(q.a()),q.id)); }

const TAGINFO = {imp:["t-imp","TEACHER IMP"], qb:["t-qb","QUESTION BANK"], saq:["t-saq","BOOK Q"], slide:["t-slide","SLIDE Q"]};
const STL = {full:["t-full","FULL ANSWER"], partial:["t-partial","PARTIAL - COMPILED"], nf:["t-nf","ANSWER NOT FOUND"]};
const isRep = q => q.tags.includes("imp") && q.tags.includes("qb");
const isHP  = q => isRep(q) || ((q.tags.includes("imp")||q.tags.includes("qb")) && q.tags.includes("saq"));

function tags(q){
  let h='';
  if(isHP(q)) h+=`<span class="tag t-hp">HIGH PRIORITY</span>`;
  if(isRep(q)) h+=`<span class="tag t-rep">REPEATED</span>`;
  q.tags.forEach(t=>h+=`<span class="tag ${TAGINFO[t][0]}">${TAGINFO[t][1]}</span>`);
  h+=`<span class="tag ${STL[q.st][0]}">${STL[q.st][1]}</span>`;
  return h;
}
function head(pn, left){ return `<div class="phead"><div>${left||''}</div><div class="pno">Date: <span></span> Page No. <b>${pn}</b></div></div>`; }

  pages.push(`<div class="page idx" id="index">${head(pn++,'')}<div class="pbody">

/* snap figures/tables to ruled lines */
function snap(){
  const lh=32;
  document.querySelectorAll('.pbody .fig, .pbody table, .pbody .nf, .pbody .warn').forEach(el=>{
    el.style.marginBottom='0'; el.style.marginTop='0';
    const h=el.getBoundingClientRect().height;
    const extra=Math.ceil(h/lh)*lh - h;
    el.style.marginBottom=extra+'px';
  });
  document.querySelectorAll('.pbody .fig').forEach(el=>{ el.style.marginTop=lh/2+'px'; el.style.marginBottom=(parseFloat(el.style.marginBottom)+lh/2)+'px'; });
}

/* filters */
function applyFilter(){
  const term=document.getElementById('search').value.trim().toLowerCase();
  const fs=document.getElementById('fSection').value, fp=document.getElementById('fPriority').value;
  let shown=0;
  Q.forEach(q=>{
    let ok = (!fs||q.s===fs);
    if(fp==='hp') ok=ok&&isHP(q);
    if(fp==='rep') ok=ok&&isRep(q);
    if(['imp','qb','saq'].includes(fp)) ok=ok&&q.tags.includes(fp);
    if(fp==='nf') ok=ok&&q.st!=='full';
    if(term){ const el=document.getElementById('p-'+q.id); ok=ok&&el.textContent.toLowerCase().includes(term); }
    document.getElementById('p-'+q.id).classList.toggle('hide',!ok);
    const r=document.querySelector(`#index tr[data-id="${q.id}"]`); if(r) r.style.opacity=ok?1:.35;
    const l=document.querySelector(`.dlink[data-id="${q.id}"]`); if(l) l.classList.toggle('hide',!ok);
    if(ok) shown++;
  });
  document.querySelectorAll('.dgroup').forEach(g=>{
    const vis=g.querySelectorAll('.dlink:not(.hide)').length;
    g.style.display=vis?'':'none'; g.querySelector('.n').textContent=vis;
  });
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===fp));
  document.getElementById('count').textContent=`${shown} of ${Q.length} answers shown`;
}

/* ---------- drawer ---------- */
const openNav=()=>document.body.classList.add('nav-open');
const closeNav=()=>document.body.classList.remove('nav-open');
function goto(id){ closeNav(); const el=document.getElementById(id); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth'}),120); }

function buildNav(){
  const nav=document.getElementById('dnav');
  const link=q=>{
    const dot=isHP(q)?'hp':q.st==='nf'?'nf':q.st==='partial'?'pt':'';
    return `<a class="dlink" data-id="${q.id}" href="#p-${q.id}"><span class="id">${q.no}</span><span>${q.q}</span>${dot?`<span class="dot ${dot}"></span>`:''}</a>`;
  };
  const group=(title,items,open)=>`<div class="dgroup${open?' open':''}"><button type="button"><span>${title}</span><span><span class="n">${items.length}</span><span class="chev">&rsaquo;</span></span></button><div class="dlist">${items.map(link).join('')}</div></div>`;
  nav.innerHTML = `<div class="dlabel" style="padding:8px 8px 0">Part A</div>` + group('Question Bank (Must Do)',Q.filter(q=>q.must),true)
    + `<div class="dlabel" style="padding:14px 8px 0">Part B &middot; Additional</div>`
    + Object.entries(SECTIONS).map(([k,v])=>{const items=Q.filter(q=>q.s===k&&!q.must);return items.length?group(v.replace(/^Chapter \d+: /,''),items,false):'';}).join('');
  nav.querySelectorAll('.dgroup > button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
  nav.querySelectorAll('.dlink').forEach(a=>a.onclick=e=>{e.preventDefault();goto('p-'+a.dataset.id);});
}

build();
buildNav();

document.getElementById('closeNav').onclick=closeNav;
document.getElementById('scrim').onclick=closeNav;
document.getElementById('openSearch').onclick=()=>{openNav();setTimeout(()=>document.getElementById('search').focus(),200);};
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openNav();setTimeout(()=>document.getElementById('search').focus(),200);}
  if(e.key==='Escape') closeNav();
});
document.getElementById('practice').onclick=function(){
  document.body.classList.toggle('practice');

};
document.getElementById('book').addEventListener('click',e=>{
  const p=e.target.closest('.qpage'); if(p && document.body.classList.contains('practice')) p.classList.toggle('reveal');

document.querySelectorAll('#index a[href^="#p-"], .qp a[href^="#p-"], #gaps a[href^="#p-"]').forEach(a=>a.onclick=e=>{e.preventDefault();goto(a.getAttribute('href').slice(1));});

/* breadcrumb + active link */
const crumb=document.getElementById('crumb');
const io=new (window.IntersectionObserver||class{observe(){}})(ents=>{
  ents.forEach(en=>{
    if(!en.isIntersecting) return;
    const el=en.target, id=el.dataset.id;
    if(id){
      const q=Q.find(x=>x.id===id);
      crumb.textContent=`${q.must?'Question Bank':SECTIONS[q.s].replace(/^Chapter \d+: /,'')} / Q.${q.no}`;
      document.querySelectorAll('.dlink.active').forEach(a=>a.classList.remove('active'));
      const l=document.querySelector(`.dlink[data-id="${id}"]`); if(l) l.classList.add('active');
    } else crumb.textContent={cover:'Cover',index:'Index',qpaper:'Question Paper',gaps:'Not in Material'}[el.id]||'';
  });
},{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('.page').forEach(p=>io.observe(p));

applyFilter();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>setTimeout(snap,50));
window.addEventListener('resize',()=>{clearTimeout(window._s);window._s=setTimeout(snap,200);});
